:root{color-scheme:dark;--ink:#f4f4f4;--gold:#ffcd75;--panel:#1a1c2c;--edge:#5d275d}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0a12;color:var(--ink);overflow:hidden;font:16px/1.45 "Pixelify Sans",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
body{position:fixed;inset:0}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.modal{position:fixed;inset:0;background:#0b0a12d0;display:none;place-items:center;padding:14px;z-index:9}
.modal.on{display:grid}
.box{background:#1a1c2c;width:min(560px,100%);max-height:calc(100vh - 28px);overflow:auto;padding:20px;box-shadow:0 0 0 3px #000,0 0 0 6px #b13e53,0 0 0 9px #000,0 14px 0 9px #0007}
.title{font:clamp(22px,6vw,40px)/1.15 "Press Start 2P",monospace;color:var(--gold);text-shadow:4px 4px 0 #b13e53,8px 8px 0 #000;text-align:center;margin:6px 0 18px}

p{margin:8px 0}
.note{font-size:14px;color:#94b0c2}
.maps{display:grid;gap:10px;margin:14px 0}
.map{display:flex;gap:12px;align-items:center;text-align:left;border:0;cursor:pointer;color:var(--ink);font:inherit;padding:10px;background:#333c57;box-shadow:inset 0 0 0 3px #000;min-height:64px}
.map:hover,.map:focus-visible{background:#3b5dc9;outline:none}
.map.lock{opacity:.45;cursor:default}
.map canvas{width:96px;height:58px;image-rendering:pixelated;flex:none;box-shadow:0 0 0 2px #000}
.map b{font:11px/1.6 "Press Start 2P",monospace}
.stars{color:var(--gold);font:12px "Press Start 2P",monospace;letter-spacing:2px}
.row{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.btn{font:11px/1 "Press Start 2P",monospace;color:#1a1c2c;background:var(--gold);border:0;min-height:46px;padding:0 18px;cursor:pointer;box-shadow:0 0 0 3px #000,inset -3px -4px 0 #ef7d57}
.btn.alt{background:#94b0c2;box-shadow:0 0 0 3px #000,inset -3px -4px 0 #566c86}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
ul{padding-left:18px;margin:8px 0}
</style>

function lineP(x0,y0,x1,y1,col,w=1){const d=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))|0;c.fillStyle=col;for(let i=0;i<=d;i++){const t=i/(d||1);c.fillRect(Math.round(lerp(x0,x1,t)),Math.round(lerp(y0,y1,t)),w,w)}}

function drawTower(t,ghost){const D=TOWERS[t.type],lv=t.lv,x=Math.round(t.x),bob=t.drop?-Math.round(Math.sin(t.drop*Math.PI)*6):0,y=Math.round(t.y)+bob,a=t.ang,rc=t.recoil*2;

  const cx=x,cy=y-4,dx=Math.cos(a),dy=Math.sin(a);
  if(t.type==='ballesta'){lineP(cx-dx*(2+rc),cy-dy*(2+rc),cx+dx*(6-rc),cy+dy*(6-rc),'#1a1c2c',2);lineP(cx-dx*(1+rc),cy-dy*(1+rc),cx+dx*(5-rc),cy+dy*(5-rc),'#c8935a');const bx=cx+dx*(3-rc),by=cy+dy*(3-rc);lineP(bx-dy*5,by+dx*5,bx+dy*5,by-dx*5,'#1a1c2c',2);lineP(bx-dy*4,by+dx*4,bx+dy*4,by-dx*4,lv>1?'#ffcd75':'#94b0c2');px(cx-1,cy-1,'#8a5a2e',3,3)}
  else if(t.type==='canon'){c.fillStyle='#1a1c2c';c.beginPath();c.arc(cx,cy,5,0,7);c.fill();c.fillStyle=lv>1?'#333c57':'#566c86';c.beginPath();c.arc(cx,cy,4,0,7);c.fill();lineP(cx,cy,cx+dx*(8-rc*1.5),cy+dy*(8-rc*1.5),'#1a1c2c',4);lineP(cx,cy,cx+dx*(7-rc*1.5),cy+dy*(7-rc*1.5),'#333c57',2);px(cx-2,cy-3,'#94b0c2',2,1);if(lv>1)px(cx-1,cy-1,'#ffcd75',2,2)}
  else if(t.type==='hielo'){const f=Math.sin(S.t*3+t.x)*1.5;const yy=cy-2+f;c.fillStyle='#1a1c2c';c.beginPath();c.moveTo(cx,yy-8);c.lineTo(cx+5,yy);c.lineTo(cx,yy+6);c.lineTo(cx-5,yy);c.fill();c.fillStyle=lv>1?'#d4f0ff':'#73eff7';c.beginPath();c.moveTo(cx,yy-7);c.lineTo(cx+4,yy);c.lineTo(cx,yy+5);c.lineTo(cx-4,yy);c.fill();px(cx-1,yy-4,'#ffffff',1,3);px(cx+1,yy-1,'#41a6f6',2,4);if(lv>1)for(let k=0;k<3;k++){const an=S.t*2+k*2.1;px(cx+Math.cos(an)*7,yy+Math.sin(an)*3,'#d4f0ff')}}
  else if(t.type==='tesla'){for(let i=0;i<3+lv;i++){px(cx-3,cy+2-i*2,'#1a1c2c',7,2);px(cx-2,cy+2-i*2,i%2?'#ef7d57':'#c8935a',5,1)}const oy=cy-4-lv*2,gl=.6+Math.sin(S.t*8+t.x)*.4;px(cx-3,oy-3,'#1a1c2c',7,6);px(cx-2,oy-2,'#a7f070',5,4);px(cx-1,oy-2,'#e8ffd0',2,2);if(R()<.15)S.bolts.push({pts:jag(cx,oy,cx+(R()-.5)*14,oy+(R()-.5)*10),t:.05})}
  else if(t.type==='mortero'){px(cx-5,cy-1,'#1a1c2c',11,7);px(cx-4,cy,'#6b4226',9,5);const ex=cx+dx*2,ey=cy-5-rc;px(ex-3,ey-1,'#1a1c2c',7,7);px(ex-2,ey,lv>1?'#c8424a':'#b13e53',5,5);px(ex-2,ey,'#1a1c2c',5,1);px(ex-1,ey+1,'#ff8a9a',1,2)}

function drawEnemy(e){const sp=ESPR[e.d.s],f=((e.ph*6)|0)%2,img=e.hit>0?sp.w[f]:sp.n[f],sc=e.d.scale||1,w=img.width*sc,h=img.height*sc,x=Math.round(e.x-w/2),bob=e.d.fly?Math.round(Math.sin(e.ph*5)*2)-6:0,y=Math.round(e.y-h+4+bob);

  if(e.burn>0&&R()<.4)S.parts.push({x:e.x+(R()-.5)*w*.6,y:e.y-R()*h*.6,vx:0,vy:-18,t:.3,c:pick(['#ffcd75','#ef7d57']),g:-10,glow:1});
  if(e.hp<e.max){const bw=Math.max(10,w*.8|0),bx=Math.round(e.x-bw/2),by=y-4;px(bx-1,by-1,'#1a1c2c',bw+2,4);px(bx,by,'#5d275d',bw,2);px(bx,by,e.d.boss?'#ffcd75':'#ff4d6d',Math.max(1,Math.round(bw*e.hp/e.max)),2)}}
let hover=null,mouse={x:-99,y:-99};
const UI=[];
function btn(x,y,w,h,label,on,opts={}){const hv=mouse.x>=x&&mouse.x<x+w&&mouse.y>=y&&mouse.y<y+h&&!opts.dis;
  px(x,y+1,'#1a1c2c',w,h);px(x,y,opts.dis?'#333c57':opts.col||'#ffcd75',w,h-1);if(!opts.dis){px(x,y,'#ffffff40',w,1);px(x,y+h-3,'#00000030',w,2)}if(hv){px(x,y,'#ffffff30',w,h-1)}

function render(){
  UI.length=0;
  const sh=S.shake>0?Math.round((R()-.5)*S.shake):0,sh2=S.shake>0?Math.round((R()-.5)*S.shake):0;
  c.save();c.translate(sh,sh2);
  c.drawImage(bgCanvas,0,0);
  if(MAPS[MAPI].theme===2){for(let k=0;k<6;k++){const x=(k*67+S.t*7)%320,y=OY+((k*41)%190);c.fillStyle='#ff6a1f'+(((S.t*4+k)|0)%2?'55':'22');c.fillRect(x|0,y|0,1,2)}}
  /* path arrows */
  const L=pathLen();for(let d=(S.t*20)%32;d<L;d+=32){const p=posAt(d);if(p[0]<0||p[0]>320)continue;c.fillStyle='#ffffff22';const dx=Math.cos(p[2]),dy=Math.sin(p[2]);c.fillRect(Math.round(p[0]+dx*2),Math.round(p[1]+dy*2),1,1);c.fillRect(Math.round(p[0]-dy),Math.round(p[1]+dx),1,1);c.fillRect(Math.round(p[0]+dy),Math.round(p[1]-dx),1,1)}

  else if(gt&&!S.place){const t=towerAt(gt[0],gt[1]);px(gt[0]*TS,OY+gt[1]*TS,'#ffffff18',TS,TS);if(t&&t!==S.sel)rangeCircle(t.x,t.y,stat(t).range*TS,'#94b0c2')}

    else{px(p.x-2,p.y+1,'#00000040',4,2);const s=p.k==='shell'?4:3;px(p.x-s/2-1,p.y-p.h-s/2-1,'#1a1c2c',s+2,s+2);px(p.x-s/2,p.y-p.h-s/2,p.k==='shell'?'#b13e53':'#333c57',s,s);px(p.x-s/2,p.y-p.h-s/2,'#94b0c2',1,1)}}
  for(const b of S.bolts){for(let k=1;k<b.pts.length;k++){lineP(b.pts[k-1][0],b.pts[k-1][1],b.pts[k][0],b.pts[k][1],'#a7f070',2);lineP(b.pts[k-1][0],b.pts[k-1][1],b.pts[k][0],b.pts[k][1],'#f4fff0')}}
  if(S.rings)for(const r of S.rings){c.strokeStyle=`rgba(255,244,208,${r.t*3})`;c.lineWidth=2;c.beginPath();c.arc(r.x,r.y,r.r,0,7);c.stroke()}

/* ================= INPUT ================= */
function toV(e){return[(e.clientX*dpr-VR.x)/VR.w*VW,(e.clientY*dpr-VR.y)/VR.h*VH]}
cv.addEventListener('pointermove',e=>{[mouse.x,mouse.y]=toV(e)});
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if(!S||S.over||modal.classList.contains('on'))return;[mouse.x,mouse.y]=toV(e);
  if(e.button===2){S.place=null;S.sel=null;return}
  for(let i=UI.length-1;i>=0;i--){const u=UI[i];if(mouse.x>=u.x&&mouse.x<u.x+u.w&&mouse.y>=u.y&&mouse.y<u.y+u.h){if(u.on)u.on();else sfx('deny');return}}
  if(mouse.x<320&&mouse.y>=OY&&mouse.y<OY+GH*TS){const tx=mouse.x/TS|0,ty=(mouse.y-OY)/TS|0;
    if(S.place){if(placeTower(S.place,tx,ty)){if(!e.shiftKey&&S.gold<TOWERS[S.place].cost)S.place=null}}
    else{const t=towerAt(tx,ty);S.sel=t||null;if(t)sfx('click')}}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(!S||S.over||modal.classList.contains('on'))return;audioInit();
  if(/^Digit[1-6]$/.test(e.code)){const k=TORDER[+e.code.slice(5)-1];S.place=S.place===k?null:k;S.sel=null;sfx('click')}
  if(e.code==='Space'){e.preventDefault();startWave()}
  if(e.code==='Escape'){if(S.place||S.sel){S.place=null;S.sel=null}else pauseMenu()}
  if(e.code==='KeyU'&&S.sel)upgrade(S.sel);if(e.code==='KeyS'&&S.sel)sell(S.sel);if(e.code==='KeyF'){S.speed=S.speed%3+1}});

/* ================= MENUS ================= */
const modal=$('modal'),box=$('box');let paused=true;
function open(h){box.innerHTML=h;modal.classList.add('on');paused=true}
function close(){modal.classList.remove('on');paused=false}
function preview(mi){const cn=document.createElement('canvas');buildMap(mi);cn.width=320;cn.height=192;cn.getContext('2d').drawImage(bgCanvas,0,OY,320,192,0,0,320,192);return cn.toDataURL()}

function lose(){S.over=true;sfx('lose');setTimeout(()=>open(`<h2>EL BASTIÓN CAYÓ</h2><p>Llegaste a la oleada ${S.wave} de ${WAVES} con ${S.kills} enemigos derrotados.</p><p class="note">Consejo: mezcla Hielo para frenar y Cañón o Llamas en las curvas, donde los enemigos se agrupan.</p><div class="row"><button class="btn alt" data-act="menu">MAPAS</button><button class="btn" data-act="retry">REINTENTAR</button></div>`),900)}
modal.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;audioInit();sfx('click');
  if(b.dataset.map!==undefined&&!b.disabled){newGame(+b.dataset.map);close();S.banner={a:MAPS[MAPI].n.toUpperCase(),b:'Coloca torres y pulsa ¡EMPEZAR!',t:0}}
  const a=b.dataset.act;if(a==='go')close();if(a==='menu')title();if(a==='retry'){newGame(MAPI);close()}});

/* ================= LOOP ================= */
let last=performance.now(),acc=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S){if(!paused){acc+=dt*S.speed;let n=0;while(acc>=1/60&&n<8){update(1/60);acc-=1/60;n++}if(n>=8)acc=0}render()}
  else{c.fillStyle='#0b0a12';c.fillRect(0,0,VW,VH);if(bgCanvas){c.globalAlpha=.45;c.drawImage(bgCanvas,0,0);c.globalAlpha=1}present()}
  requestAnimationFrame(loop)}
title();requestAnimationFrame(loop);
}
</script>
</body>
