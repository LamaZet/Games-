  if(d.act==='wipe2'){try{localStorage.removeItem(KEY)}catch(_){}G=null;close();creation(null);return}
  if(d.pos){draftP.pos=d.pos;return creation(CARRY)}if(d.skin){draftP.skin=+d.skin;return creation(CARRY)}if(d.hair){draftP.hair=+d.hair;return creation(CARRY)}
  if(d.act==='create'){draftP.name=($('nm').value.trim()||'Novato').slice(0,12);draftP.num=clamp(+$('nu').value||10,1,99);modal.classList.remove('on');newGame(draftP,CARRY);UI=true;refresh();renderTick();agentPick(true);return}
});
$('bInstr').onclick=instrMenu;$('bFast').onclick=()=>{if(!MS)return;MS.speed=MS.speed===1?2.5:1;$('bFast').textContent=MS.speed===1?'x2':'x1'};
$('bSkip').onclick=()=>{if(!MS||MS.ended)return;MS.visual=false;while(!MS.ended)beat();MS.visual=true};
document.querySelectorAll('.spd button').forEach(b=>b.onclick=()=>{if(G&&mode==='base')setSpeed(+b.dataset.sp)});
let draftP={name:'',num:10,pos:'DEL',skin:0,hair:0},CARRY=null;
function creation(carry){CARRY=carry;const p=draftP;
  win.innerHTML=`<h2>${ic('star')} Historia de un Crack</h2><p>Crea a tu futbolista. Empezarás en la ${TIERS[0].n}. ¡Llega a la Superliga y gana el Balón Dorado!</p>
  <label for="nm">NOMBRE</label><input type="text" id="nm" maxlength="12" value="${p.name.replace(/"/g,'')}" placeholder="Tu apellido">
  <label for="nu">DORSAL</label><input type="number" id="nu" min="1" max="99" value="${p.num}">
  <label>POSICIÓN</label><div class="opts">${Object.keys(POSN).map(k=>`<button class="opt ${p.pos===k?'on':''}" data-pos="${k}">${POSN[k].toUpperCase()}</button>`).join('')}</div>
  <label>PIEL</label><div class="opts">${SKIN.map((c,i)=>`<button class="opt swc ${p.skin===i?'on':''}" data-skin="${i}" style="background:${c}" aria-label="Tono ${i+1}"></button>`).join('')}</div>
  <label>PELO</label><div class="opts">${HAIR.map((c,i)=>`<button class="opt swc ${p.hair===i?'on':''}" data-hair="${i}" style="background:${c}" aria-label="Pelo ${i+1}"></button>`).join('')}<button class="opt ${p.hair===5?'on':''}" data-hair="5">RAPADO</button></div>
  ${carry?'<p class="note">Conservas tus instalaciones y recibes 2000 de dinero extra.</p>':''}
  <div class="row end"><button class="btn" data-act="create">¡A JUGAR!</button></div>`;
  modal.classList.add('on');const nm=$('nm'),nu=$('nu');nm.oninput=()=>draftP.name=nm.value;nu.oninput=()=>draftP.num=+nu.value||10}

/* ================= HUD ================= */
function refresh(){if(!G)return;$('rMoney').textContent=fmt(G.money);$('rBulb').textContent=fmt(G.bulb);$('rHeart').textContent=fmt(G.heart);$('rFan').textContent=fmt(G.fan);
  $('dateT').textContent=`Año ${G.y} · ${MONTHS[G.m-1]} · S${G.w}`;
  const k=wi(),nx=LEAGUE_WK.find(x=>x>=k);const mb=document.querySelector('[data-m="match"]');if(mb)mb.classList.toggle('alert',nx!=null&&nx-k<=2)}
function renderTick(lines){$('tick').innerHTML=(lines||G.log).filter(Boolean).slice(0,2).map(l=>`<p>${l}</p>`).join('')||'<p>&nbsp;</p>'}
function fit(){const top=document.querySelector('.top').offsetHeight,avH=innerHeight-top-58-(mode==='match'?60:132)-48,avW=Math.min(innerWidth,620)-24;const r=Math.min(avW/CW,avH/CH),k=r>=3?Math.floor(r):Math.max(1,r);cv.style.width=CW*k+'px';cv.style.height=CH*k+'px'}
addEventListener('resize',fit);

/* ================= LOOP ================= */
drawBase();
let last=performance.now();
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  if(G){if(mode==='base'){if(!modal.classList.contains('on')&&G.speed>0&&busT<0){acc+=dt*(G.speed===2?2.5:1);G.wp=acc/WEEK;if(acc>=WEEK){acc=0;tickWeek();refresh()}}
      $('wkB').style.width=(acc/WEEK*100)+'%';if(busT>=0)busT+=dt*.8;updWalker(dt);renderBase(now,dt)}
    else if(MS){matchTick(dt);renderMatch(now,dt)}}
  else{ctx.drawImage(base,0,0);LOTS.forEach(([X,Y],i)=>drawFac(ctx,['park','track','shop','gym','pool','video','tv'][i],1+(i%3),X,Y,now))}
  requestAnimationFrame(loop)}
fit();requestAnimationFrame(loop);
if(G&&G.name){UI=true;refresh();renderTick();setSpeed(G.speed||1);if(!G.agent)agentPick(true)}else creation(null);
setTimeout(fit,300);
}
</script>
</body>
</html>
