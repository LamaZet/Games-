function matchTick(dt){if(!MS||MS.paused||MS.ended)return;
  const B=MS.ball,sp=MS.speed;
  for(const q of MS.pl){const[TX,TZ]=plPos(q);let tx=TX,tz=TZ;const car=MS.car.t===q.t&&MS.car.i===q.i;
    if(car&&B.t>=1&&!B.shot){tx=TX;tz=TZ}
    if(MS.cel>0&&q.t===MS.celTeam&&q.i!==0){const sc=MS.pl.find(p=>p.t===MS.celTeam&&p.i===MS.scorer)||q;tx=sc.x+Math.cos(q.i)*2;tz=sc.z+Math.sin(q.i)*1.5}
    const dx=tx-q.x,dz=tz-q.z,d=Math.hypot(dx,dz),mv=Math.min(d,(q.i===0?6:8.5)*dt*sp*(d>6?1.25:1));
    if(d>.05){q.x+=dx/d*mv;q.z+=dz/d*mv}q.spd=mv/Math.max(dt,1e-3)/sp;q.ph+=mv*1.15;
    if(Math.abs(dx)>.3)q.face=dx>0?1:-1;else if(q.spd<1){const[bx]=ballPos();q.face=bx>q.x?1:-1}
    q.kick=Math.max(0,q.kick-dt*sp);q.dive=Math.max(0,q.dive-dt*sp)}
  if(B.t<1){B.t=Math.min(1,B.t+dt*sp/B.dur);if(!B.shot){const q=MS.pl.find(q=>q.t===MS.car.t&&q.i===MS.car.i);B.fx=q.x+q.face*.6;B.fz=q.z+.3}}
  if(MS.cel>0||MS.replay)return;
  MS.bt+=dt*sp;if(MS.bt<1.15)return;MS.bt=0;
  const cur=ballPos();beat();if(!MS||MS.ended)return;
  const ev=MS.ev||{type:'none'};B.x=cur[0];B.z=cur[1];B.t=0;B.shot=false;B.endH=0;
  if(ev.type==='shoot'||ev.type==='shot'){const shq=MS.pl.find(q=>q.t===ev.t&&q.i===ev.i);shq.kick=.32;const gx=ev.t===0?FLEN+1.2:-1.2;let gz=34+(R()-.5)*6,eh=.3+R()*1.6;
    if(ev.miss){gz=34+(R()<.5?-1:1)*(4.6+R()*4);eh=R()<.4?3.2:.8}
    else if(!ev.goal){const gk=MS.pl.find(q=>q.t===1-ev.t&&q.i===0);gk.dive=.6;gk.dd=(gz>gk.z?1:-1)*(ev.t===0?1:-1);gz=gk.z+(gz>gk.z?1.4:-1.4);}
    B.fx=ev.goal||ev.miss?gx:(ev.t===0?FLEN-1:1);B.fz=gz;B.arc=.4;B.endH=eh;B.shot=true;B.dur=.38;
    if(ev.goal){MS.goalMark=MS.rec.length;MS.cel=2.4;MS.celTeam=ev.t;MS.scorer=ev.i;MS.scorerName=ev.t===0&&ev.i===MS.uIdx&&MS.play?G.name:ev.t===0?myClub().n:MS.oppT.n}}
  else{const q=MS.pl.find(q=>q.t===MS.car.t&&q.i===MS.car.i),d=Math.hypot(q.x-cur[0],q.z-cur[1]);B.fx=q.x;B.fz=q.z;B.arc=d>22?3.2:d>10?.9:.15;B.dur=clamp(d/26,.18,.75);
    if(ev.type==='pass'){const p=MS.pl.find(p=>p.t===ev.t&&p.i===ev.i);if(p)p.kick=.28}}
}

  if(G.agent&&!first){G.agent.lv++;G.agent.hb++;G.agent.bb++}
  open(`<h2>${ic('agent')} ${first?'Elige tu agente':'Renovar agente'}</h2><p class="note">El agente decide cuántos corazones e ideas ganas por partido. Si lo mantienes, sube de nivel cada año.</p>
  <div class="list">${G.agent&&!first?`<button class="it" data-agent="keep"><span class="grow"><b>${G.agent.n} (renovar) Nv${G.agent.lv}</b><small>${ic('heart')}+${G.agent.hb} ${ic('bulb')}+${G.agent.bb} por partido</small></span><span class="cost">gratis</span></button>`:''}
   ${cand.map((c,i)=>`<button class="it" data-agent="${i}"><span class="grow"><b>${c.n}</b><small>${ic('heart')}+${c.hb} ${ic('bulb')}+${c.bb} por partido</small></span><span class="cost">${ic('money')}${fmt(c.fee)}</span></button>`).join('')}</div>`);
  AGC=cand}
let AGC=[];
function leagueMenu(){const tb=standings();open(`<h2>${ic('cup')} ${TIERS[G.lg.tier].n}</h2><p>Jornada ${G.lg.md} de 14 · Año ${G.y}</p>
  <table><thead><tr><th>#</th><th>Club</th><th>PJ</th><th>DG</th><th>PTS</th></tr></thead><tbody>${tb.map((t,k)=>`<tr class="${t.i===G.club?'me':''}"><td>${k+1}</td><td>${G.lg.teams[t.i].n}</td><td>${t.pj}</td><td>${t.gf-t.gc>0?'+':''}${t.gf-t.gc}</td><td>${t.pts}</td></tr>`).join('')}</tbody></table>
  <p class="note">Los 4 primeros juegan la copa en octubre y noviembre. El campeón asciende.</p><div class="row end"><button class="btn" data-act="close">CERRAR</button></div>`)}
modal.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.act==='close')return close();
  if(d.act==='fac')return facMenu();
  if(d.tr){train(METHODS.find(m=>m.id===d.tr));return}
  if(d.build){const f=FAC[d.build];if(G.money<f.cost[0])return say('No tienes suficiente dinero.');G.money-=f.cost[0];G.fac[+d.lot]={type:d.build,lv:1};log(`¡Construiste ${f.n}!`);save();refresh();return facMenu()}
  if(d.lot!==undefined&&!d.build)return lotMenu(+d.lot);
  if(d.up!==undefined){const f=G.fac[+d.up],c=FAC[f.type].cost[f.lv];if(G.money>=c){G.money-=c;f.lv++;log(`${FAC[f.type].n} sube a nivel ${f.lv}.`);save();refresh()}return lotMenu(+d.up)}
  if(d.fr!==undefined){if(b.classList.contains('dis'))return;close();matchDay('amistoso',+d.fr);return}
  if(d.pref){G.pref=d.pref;save();return playerMenu()}
  if(d.eq){const i=G.eq.indexOf(d.eq);if(i>=0)G.eq.splice(i,1);else if(G.eq.length<3)G.eq.push(d.eq);else say('Solo puedes equipar 3 habilidades.');save();return playerMenu()}
  if(d.use){if(!(G.items[d.use]>0))return;if(d.use==='bebida'){G.items.bebida--;G.stam=Math.min(100,G.stam+40);log('¡Bebida! +40 de resistencia.')}else{if(!G.inj)return say('No estás lesionado.');G.items.masaje--;G.inj=Math.max(0,G.inj-3);log('Masaje: te recuperas más rápido.')}save();refresh();return playerMenu()}
  if(d.buy){const it=ITEMS.find(i=>i.id===d.buy);if(b.classList.contains('dis'))return;if(it.heart&&G.heart<it.heart||it.money&&G.money<it.money)return say('No te alcanza.');
    if(it.heart)G.heart-=it.heart;else G.money-=it.money;
    if(it.skill){G.skills.push(it.id);if(G.eq.length<3)G.eq.push(it.id);log(`Aprendiste: ${it.n.replace('Libro: ','')}.`)}
    else if(it.id==='libreta'){G.bulb+=20;log('+20 ideas.')}else if(it.id==='botas'){G.once.botas=1;G.st.vel+=15;log('¡Botas de élite! +15 Velocidad.')}else{G.items[it.id]=(G.items[it.id]||0)+1;log(`Compraste ${it.n}.`)}
    save();refresh();return shopMenu()}
  if(d.neg){const s=SP(d.neg);if(b.classList.contains('dis'))return;if(G.heart<s.cost)return say('Necesitas más corazones.');G.heart-=s.cost;const g=Math.round(15+R()*30+repLv(G.rep)*2);G.neg[s.id]=Math.min(100,(G.neg[s.id]||0)+g);
    if(G.neg[s.id]>=100){G.spons.push({id:s.id,lv:1});delete G.neg[s.id];log(`¡${s.n} te patrocina!`)}else log(`${s.n}: convencido al ${G.neg[s.id]}%.`);save();refresh();return sponsorMenu()}
  if(d.spup){const sp=G.spons.find(x=>x.id===d.spup),s=SP(d.spup),c=s.pay*20*sp.lv;if(G.money>=c){G.money-=c;sp.lv++;log(`${s.n} sube a nivel ${sp.lv}.`)}save();refresh();return sponsorMenu()}
  if(d.strat){G.strat=d.strat;save();return agentMenu()}
  if(d.agent!==undefined){if(d.agent!=='keep'){const c=AGC[+d.agent];if(G.money<c.fee&&G.agent)return say('No te alcanza para ese agente.');G.money=Math.max(0,G.money-c.fee);G.agent=c;log(`${c.n} es tu nuevo agente.`)}else log(`Renovaste con ${G.agent.n}.`);save();close();setSpeed(1);return}
  if(d.act==='mplay'){close();setSpeed(0);busT=0;setTimeout(()=>{busT=-1;startMatch(true)},1300);return}
  if(d.act==='msim'){close();startMatch(false);return}
  if(d.act==='hgo'){close();return}
  if(d.act==='hsub'){MS.play=false;MS.ourStr*=.92;comment(`${G.name} pide el cambio.`);close();return}
  if(d.act==='hdrink'){G.items.bebida--;G.stam=Math.min(100,G.stam+40);comment(`${G.name} recupera fuerzas.`);return halftime()}
  if(d.ins){MS.instr=d.ins;MS.instrUsed=true;comment({normal:'Orden: juego normal.',pedir:`${G.name} pide más el balón.`,colectivo:'Orden: juego colectivo.',defender:`${G.name} ayudará en defensa.`}[d.ins]);close();return}
  if(d.act==='mdone'){close();if(MS&&MS.visual)leaveMatch();else{MS=null;setSpeed(1)}return}
  if(d.offer!==undefined){close();nextYear(+d.offer);return}
  if(d.act==='ystay'){close();nextYear(null);return}
  if(d.act==='keepgo'){close();agentPick(false);return}
  if(d.act==='newplus'){const carry={fac:G.fac,bonus:2000};close();creation(carry);return}
  if(d.act==='wipe'){open(`<h2>¿Borrar partida?</h2><p>Perderás a ${G.name} y todo su progreso.</p><div class="row end"><button class="btn alt" data-act="close">NO</button><button class="btn red" data-act="wipe2">BORRAR</button></div>`);return}
  if(d.act==='wipe2'){try{localStorage.removeItem(KEY)}catch(_){}G=null;close();creation(null);return}
  if(d.pos){draftP.pos=d.pos;return creation(CARRY)}if(d.skin){draftP.skin=+d.skin;return creation(CARRY)}if(d.hair){draftP.hair=+d.hair;return creation(CARRY)}
  if(d.act==='create'){draftP.name=($('nm').value.trim()||'Novato').slice(0,12);draftP.num=clamp(+$('nu').value||10,1,99);modal.classList.remove('on');newGame(draftP,CARRY);UI=true;refresh();renderTick();agentPick(true);return}
});
cv.addEventListener('click',()=>{if(MS&&MS.replay)endReplay()});$('bInstr').onclick=instrMenu;$('bFast').onclick=()=>{if(!MS)return;MS.speed=MS.speed===1?2.5:1;$('bFast').textContent=MS.speed===1?'x2':'x1'};
$('bSkip').onclick=()=>{if(!MS||MS.ended)return;MS.visual=false;while(!MS.ended)beat();MS.visual=true};
document.querySelectorAll('.spd button').forEach(b=>b.onclick=()=>{if(G&&mode==='base')setSpeed(+b.dataset.sp)});
let draftP={name:'',num:10,pos:'DEL',skin:0,hair:0},CARRY=null;
function creation(carry){CARRY=carry;const p=draftP;
  win.innerHTML=`<h2>${ic('star')} Historia de un Crack</h2><p>Crea a tu futbolista. Empezarás en la ${TIERS[0].n}. ¡Llega a la Superliga y gana el Balón Dorado!</p>
  <label for="nm">NOMBRE</label><input type="text" id="nm" maxlength="12" value="${p.name.replace(/"/g,'')}" placeholder="Tu apellido">
  <label for="nu">DORSAL</label><input type="number" id="nu" min="1" max="99" value="${p.num}">
  <label>POSICIÓN</label><div class="opts">${Object.keys(POSN).map(k=>`<button class="opt ${p.pos===k?'on':''}" data-pos="${k}">${POSN[k].toUpperCase()}</button>`).join('')}</div>
  <label>PIEL</label><div class="opts">${SKIN.map((c,i)=>`<button class="opt swc ${p.skin===i?'on':''}" data-skin="${i}" style="background:${c}" aria-label="Tono ${i+1}"></button>`).join('')}</div>
  <label>PELO</label><div class="opts">${HAIR.map((c,i)=>`<button class="opt swc ${p.hair===i?'on':''}" data-hair="${i}" style="background:${c}" aria-label="Pelo ${i+1}"></button>`).join('')}<button class="opt ${p.hair===5?'on':''}" data-hair="5">RAPADO</button></div>
  ${carry?'<p class="note">Conservas tus instalaciones y recibes 2000 de dinero extra.</p>':''}
  <div class="row end"><button class="btn" data-act="create">¡A JUGAR!</button></div>`;
  modal.classList.add('on');const nm=$('nm'),nu=$('nu');nm.oninput=()=>draftP.name=nm.value;nu.oninput=()=>draftP.num=+nu.value||10}

/* ================= HUD ================= */
function refresh(){if(!G)return;$('rMoney').textContent=fmt(G.money);$('rBulb').textContent=fmt(G.bulb);$('rHeart').textContent=fmt(G.heart);$('rFan').textContent=fmt(G.fan);
  $('dateT').textContent=`Año ${G.y} · ${MONTHS[G.m-1]} · S${G.w}`;
  const k=wi(),nx=LEAGUE_WK.find(x=>x>=k);const mb=document.querySelector('[data-m="match"]');if(mb)mb.classList.toggle('alert',nx!=null&&nx-k<=2)}
function renderTick(lines){$('tick').innerHTML=(lines||G.log).filter(Boolean).slice(0,2).map(l=>`<p>${l}</p>`).join('')||'<p>&nbsp;</p>'}
function fit(){const dw=mode==='match'?288:CW,dh=mode==='match'?200:CH;const top=document.querySelector('.top').offsetHeight,avH=innerHeight-top-58-(mode==='match'?60:132)-48,avW=Math.min(innerWidth,620)-24;const k=Math.max(1,Math.min(avW/dw,avH/dh)),w=Math.round(dw*k),h=Math.round(dh*k),d=Math.min(devicePixelRatio||1,3);cv.style.width=w+'px';cv.style.height=h+'px';cv.width=Math.round(w*d);cv.height=Math.round(h*d)}
addEventListener('resize',fit);

/* ================= LOOP ================= */
drawBase();
let last=performance.now();
function loop(now){const dt=Math.min(.1,(now-last)/1000);last=now;
  if(G){if(mode==='base'){if(!modal.classList.contains('on')&&G.speed>0&&busT<0){acc+=dt*(G.speed===2?2.5:1);G.wp=acc/WEEK;if(acc>=WEEK){acc=0;tickWeek();refresh()}}
      $('wkB').style.width=(acc/WEEK*100)+'%';if(busT>=0)busT+=dt*.8;updWalker(dt);renderBase(now,dt);present(blo)}
    else if(MS){matchTick(dt);renderMatch(now,dt);present(mlo)}}
  else{ctx.drawImage(base,0,0);LOTS.forEach(([X,Y],i)=>drawFac(ctx,['park','track','shop','gym','pool','video','tv'][i],1+(i%3),X,Y,now));ambient(now,1/60);present(blo)}
  requestAnimationFrame(loop)}
fit();requestAnimationFrame(loop);
if(G&&G.name){UI=true;refresh();renderTick();setSpeed(G.speed||1);if(!G.agent)agentPick(true)}else creation(null);
setTimeout(fit,300);
}
</script>
</body>
</html>
