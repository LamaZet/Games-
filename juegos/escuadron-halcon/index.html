:root{color-scheme:dark;--ink:#e8ecef;--amber:#ffcd75;--green:#a7f070}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07080d;color:var(--ink);overflow:hidden;font:16px/1.45 "Pixelify Sans",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
body{position:fixed;inset:0}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.modal{position:fixed;inset:0;background:#07080dd8;display:none;place-items:center;padding:14px;z-index:9}
.modal.on{display:grid}
.box{background:#10151e;width:min(600px,100%);max-height:calc(100vh - 28px);overflow:auto;padding:20px;box-shadow:0 0 0 3px #000,0 0 0 6px #38b764,0 0 0 9px #000,0 14px 0 9px #0007}
.title{font:clamp(20px,5.4vw,36px)/1.2 "Press Start 2P",monospace;color:var(--amber);text-shadow:4px 4px 0 #257179,8px 8px 0 #000;text-align:center;margin:6px 0 6px}
.sub{text-align:center;color:var(--green);font:10px/1.6 "Press Start 2P",monospace;margin-bottom:14px}
h2{font:15px/1.4 "Press Start 2P",monospace;color:var(--amber);margin:0 0 12px}
p{margin:8px 0}
.note{font-size:14px;color:#94b0c2}
.list{display:grid;gap:10px;margin:14px 0}
.ms{display:flex;gap:12px;align-items:center;text-align:left;border:0;cursor:pointer;color:var(--ink);font:inherit;padding:10px;background:#1d2a33;box-shadow:inset 0 0 0 3px #000;min-height:64px}
.ms:hover,.ms:focus-visible{background:#257179;outline:none}
.ms.lock{opacity:.45;cursor:default}
.ms img{width:110px;height:66px;image-rendering:pixelated;flex:none;box-shadow:0 0 0 2px #000}
.ms b{font:11px/1.6 "Press Start 2P",monospace}
.stars{color:var(--amber);font:12px "Press Start 2P",monospace;letter-spacing:2px}
.row{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.btn{font:11px/1 "Press Start 2P",monospace;color:#10151e;background:var(--amber);border:0;min-height:46px;padding:0 18px;cursor:pointer;box-shadow:0 0 0 3px #000,inset -3px -4px 0 #ef7d57}
.btn.alt{background:#94b0c2;box-shadow:0 0 0 3px #000,inset -3px -4px 0 #566c86}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
ul{padding-left:18px;margin:8px 0}
li{margin:3px 0}
kbd{font:11px "Press Start 2P",monospace;background:#333c57;padding:2px 5px;box-shadow:0 2px 0 #000}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 16px;margin:12px 0;font-size:17px}
.stat span:nth-child(even){color:var(--amber);text-align:right}
</style>

let noiseBuf=null;function noise(dur,vol,fc2,type='lowpass',delay=0){if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1}

function fire(sh,tg){const w=sh.w;sh.cd=w.cd*(.85+R()*.3);sh.shots=(sh.shots||0)+1;sfx(w.snd);noiseAt(sh.x,sh.y,w.noise,sh);

function hurt(u,dmg,src,a){if(!u.alive)return;u.hp-=dmg*(u.d&&u.d.armor?.72:1);u.hitT=.12;sfx('hit');

/* ================= UPDATE ================= */
function update(dt){
  S.t+=dt;S.time+=dt;
  if(S.M.type==='bomb'&&!S.over){S.bombT-=dt;const iv=S.bombT<30?.5:1;if(S.t-S.lastBeep>iv){S.lastBeep=S.t;sfx('beep')}if(S.bombT<=0){S.bombT=0;S.boom=1;S.white=1;sfx('breach');sfx('flash');endGame(false,'La bomba explotó.')}}
  for(const o of S.ops)updOp(o,dt);
  for(const e of S.ens)updEn(e,dt);
  updClears(dt);for(const pg of S.pings)pg.t-=dt;S.pings=S.pings.filter(pg=>pg.t>0);
  /* hostages */
  for(const h of S.hos){if(h.dead||h.secured)continue;for(const o of S.ops)if(o.alive&&hyp(o.x-h.x,o.y-h.y)<1.25&&los(o.x,o.y,h.x,h.y)){h.secured=true;sfx('secure');say(o,'¡REHÉN ASEGURADO!','#a7f070');radio(o.n,'Rehén asegurado.',o.col);break}}
  /* bomb */
  if(S.bomb&&!S.over){const near=S.ops.find(o=>o.alive&&hyp(o.x-S.bomb.x,o.y-S.bomb.y)<1.15);if(near){if(S.bomb.prog===0)radio(near.n,'Desactivando la bomba. Cúbranme.',near.col);S.bomb.prog+=dt;S.bomb.who=near;if(((S.bomb.prog*4)|0)!==((S.bomb.prog*4-dt*4)|0))sfx('click');if(S.bomb.prog>=5){S.bomb.done=true;sfx('secure');radio(near.n,'Bomba desactivada.',near.col)}}else S.bomb.who=null}
  /* flashes */
  for(const f of S.flashes){f.t+=dt;const k=Math.min(1,f.t/f.dur);f.x=lerp(f.sx,f.ex,k);f.y=lerp(f.sy,f.ey,k);f.h=Math.sin(k*Math.PI)*.6;f.spin+=dt*14;if(k>=1){f.fuse-=dt;if(f.fuse<=0){f.dead=true;explodeFlash(f)}}}
  S.flashes=S.flashes.filter(f=>!f.dead);
  for(const p of S.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;const dr=Math.exp(-(p.drag||0)*dt);p.vx*=dr;p.vy*=dr;if(p.stay&&p.t<0.05&&!p.settled){p.settled=1;if(S.decals.length<600)S.decals.push({x:p.x,y:p.y,c:p.c})}p.t-=dt}
  S.parts=S.parts.filter(p=>p.t>0);
  for(const t of S.tracers)t.t-=dt;S.tracers=S.tracers.filter(t=>t.t>0);
  if(S.muzzle){for(const m of S.muzzle)m.t-=dt;S.muzzle=S.muzzle.filter(m=>m.t>0)}
  if(S.fx){for(const f of S.fx)f.t-=dt;S.fx=S.fx.filter(f=>f.t>0)}
  for(const f of S.floats){f.t-=dt;f.y-=dt*.5}S.floats=S.floats.filter(f=>f.t>0);
  for(const dr of doors.values())if(dr.state===1&&dr.swing<1)dr.swing=Math.min(1,dr.swing+dt*5);
  /* win */
  if(!S.over){const M=S.M;
    if(M.type==='elim'&&!S.ens.some(e=>e.alive))endGame(true,'Todos los objetivos neutralizados.');
    if(M.type==='rescue'&&S.hos.every(h=>h.secured))endGame(true,'Rehenes a salvo.');
    if(M.type==='bomb'&&S.bomb&&S.bomb.done)endGame(true,'Bomba desactivada.')}}
function stepToward(u,tx,ty,sp,dt){const dx=tx-u.x,dy=ty-u.y,d=hyp(dx,dy),s=sp*dt;if(d<=s){u.x=tx;u.y=ty;return true}u.x+=dx/d*s;u.y+=dy/d*s;u.moving=true;u.moveAng=Math.atan2(dy,dx);return false}
function updOp(o,dt){o.hitT-=dt;if(!o.alive)return;if(o.player){updPlayer(o,dt);return}o.react-=dt;o.cd-=dt;o.moving=false;
  let best=null,bd=1e9;for(const e of S.ens){if(!e.alive)continue;if(!canSee(o,e,OPFOV,o.w.range+3))continue;const d=hyp(e.x-o.x,e.y-o.y)-(e.target===o?3:0)-(e.stun>0?-2:0);if(d<bd){bd=d;best=e}}
  if(best){if(!o.target){o.react=Math.max(o.react,.32+R()*.18);if(S.t-o.lastCall>4){o.lastCall=S.t;say(o,'¡CONTACTO!');sfx('radio',1.2)}}o.target=best}else o.target=null;
  if(o.busy>0){o.busy-=dt;if(o.busy<=0&&o.busyFn){const f=o.busyFn;o.busyFn=null;o.busyTxt='';f()}}
  else if(o.wait){}
  else{
    if(o.order&&!o.plan.length&&!o.cur)runOrder(o,dt);
    if(!o.path.length&&o.cur)arrive(o);
    else if(!o.path.length&&!o.cur&&o.plan.length){o.cur=o.plan.shift();o.path=o.cur.nodes.slice()}
    if(o.path.length&&o.busy<=0&&!o.wait){const[nx,ny]=o.path[0],dr=doorAt(nx,ny);
      if(dr&&dr.state===0){doorAction(o,dr)}

  const want=o.target?Math.atan2(o.target.y-o.y,o.target.x-o.x):o.moving?o.moveAng:o.lookAng,da=angD(o.ang,want),tr=o.d.turn*dt;o.ang+=Math.abs(da)<tr?da:Math.sign(da)*tr;
  if(o.target&&o.react<=0&&o.cd<=0&&Math.abs(angD(o.ang,want))<.22)fire(o,o.target)}
function arrive(o){const w=o.cur;o.cur=null;if(w.look!=null)o.lookAng=w.look;
  const hold=()=>{if(w.hold){o.wait=w.hold;say(o,'EN POSICIÓN '+w.hold,'#ffcd75');sfx('radio',.9)}};
  if(w.flash&&o.fl>0){o.lookAng=Math.atan2(w.flash.y-o.y,w.flash.x-o.x);o.busy=.45;o.busyTxt='FLASH';o.busyFn=()=>{throwFlash(o,w.flash.x,w.flash.y);o.busy=.35;o.busyTxt='FLASH';o.busyFn=hold}}else hold()}
function doorAction(o,dr){o.lookAng=Math.atan2(dr.y+.5-o.y,dr.x+.5-o.x);const m=dr.mode;
  if(m==='abrir'){o.busy=.75;o.busyTxt='PUERTA';o.busyFn=()=>openDoor(dr)}
  else{o.busy=o.d.breacher?.3:.6;o.busyTxt='BRECHA';say(o,m==='flash'&&o.fl>0?'¡BRECHA Y FLASH!':'¡BRECHA!');
    o.busyFn=()=>{if(dr.state!==0)return;breach(dr,o);if(m==='flash'&&o.fl>0){const a=Math.atan2(dr.y+.5-o.y,dr.x+.5-o.x);const nx=o.path[1];let tx,ty;if(nx){const aa=Math.atan2(nx[1]+.5-(dr.y+.5),nx[0]+.5-(dr.x+.5));tx=dr.x+.5+Math.cos(aa)*2.8;ty=dr.y+.5+Math.sin(aa)*2.8}else{tx=dr.x+.5+Math.cos(a)*2.8;ty=dr.y+.5+Math.sin(a)*2.8}
      o.fl--;S.flashes.push({sx:dr.x+.5,sy:dr.y+.5,x:dr.x+.5,y:dr.y+.5,ex:tx,ey:ty,t:0,dur:.18,fuse:.12,spin:0});sfx('throw');o.busy=.5;o.busyTxt='FLASH';o.busyFn=()=>{}}}}}
function updEn(e,dt){e.hitT-=dt;e.mark-=dt;if(!e.alive)return;e.cd-=dt;e.react-=dt;e.moving=false;
  if(e.stun>0){e.stun-=dt;e.ang+=dt*2.2*Math.sin(S.t*1.7+e.id*3);e.target=null;return}
  let best=null,bd=1e9;for(const o of S.ops){if(!o.alive)continue;if(!canSee(e,o,e.alert?2.3:1.75,ENR))continue;const d=hyp(o.x-e.x,o.y-e.y);if(d<bd){bd=d;best=o}}
  if(best){if(e.target!==best){e.react=Math.max(e.react,(e.alert?.28:.6)+R()*.2);if(!e.alert){alertE(e);noiseAt(e.x,e.y,5,e)}}e.target=best;e.lostT=0;e.noise={x:best.x,y:best.y};e.path=[]}
  else if(e.target){e.lostT+=dt;if(e.lostT>1.3)e.target=null}
  if(e.exec&&e.alert&&!e.exec.secured&&!e.exec.dead){e.execT+=dt;e.exec.danger=e.execT/4.2;if(e.execT>=4.2){const h=e.exec;e.ang=Math.atan2(h.y-e.y,h.x-e.x);sfx(e.w.snd);S.tracers.push({x0:e.x,y0:e.y,x1:h.x,y1:h.y,t:.1,team:1});h.dead=true;S.white=Math.max(S.white,.15);radio('CENTRAL','¡Han ejecutado a un rehén!','#ff6b6b');endGame(false,'Un rehén fue ejecutado.');return}}
  if(e.busy>0){e.busy-=dt;if(e.busy<=0&&e.busyFn){const f=e.busyFn;e.busyFn=null;f()}}
  else if(!e.target){
    if(e.path.length){const[nx,ny]=e.path[0],dr=doorAt(nx,ny);if(dr&&dr.state===0){e.busy=1;e.busyFn=()=>openDoor(dr)}else if(stepToward(e,nx+.5,ny+.5,e.alert?1.7:.85,dt))e.path.shift()}

    ['WASD: MOVERTE','RATÓN: APUNTAR','CLIC: DISPARAR','CHOCA CON PUERTA: ABRIR','','CLIC DERECHO - ORDEN:',' EN PUERTA: DESPEJAR',' EN REHÉN: ASEGURAR',' EN SUELO: IR AHÍ'].forEach((l,i)=>T(l,bx+1,by+38+i*7,i>=5?'#ffcd75':'#6b7a90',1,null));
    btn(bx,VH-24,bw*2+1,20,S.paused?'CONTINUAR':'PAUSA',()=>togglePause(),{on:S.paused,col:'#a7f070'});
    S.log.forEach((l,i)=>{if(l.t<=0)return;const y=MY+GH*TS-9-i*8;const s2=l.who.toUpperCase()+': '+l.s;c.globalAlpha=Math.min(1,l.t)*(1-i*.18);px(2,y-1,'#0b0d14b0',TW(s2)+4,7);T(l.who.toUpperCase()+':',4,y,l.col,1,null);T(l.s,4+TW(l.who.toUpperCase()+': '),y,'#e8ecef',1,null);c.globalAlpha=1});return}
  const tools=[['mover','MOVER','M'],['mirar','MIRAR','L'],['flash','FLASH','F'],['puerta','PUERTA','P']];
  tools.forEach(([k,l,key],i)=>btn(bx+(i%2)*(bw+1),by+(i/2|0)*14,bw,13,l,()=>{S.tool=S.tool===k&&k!=='mover'?'mover':k;sfx('click')},{on:S.tool===k,key}));
  btn(bx,by+28,bw,13,'CÓDIGO',()=>cycleHold(),{key:'C'});
  btn(bx+bw+1,by+28,bw,13,'DESHACER',()=>undo(),{key:'Z'});
  btn(bx,by+42,bw,13,'BORRAR',()=>clearPlan(),{key:'X'});
  btn(bx+bw+1,by+42,bw,13,'VEL x'+S.speed,()=>{S.speed=S.speed===1?2:1;sfx('click')},{});
  const waitA=S.ops.some(o=>o.alive&&o.wait==='A'),waitB=S.ops.some(o=>o.alive&&o.wait==='B');
  btn(bx,by+56,bw,13,'DESPEJAR',()=>{S.tool=S.tool==='despejar'?'mover':'despejar';sfx('click')},{on:S.tool==='despejar',col:'#ef7d57',key:'R'});
  btn(bx+bw+1,by+56,bw,13,'TODOS',()=>{S.tool=S.tool==='todos'?'mover':'todos';sfx('click')},{on:S.tool==='todos',col:'#a7f070',key:'T'});
  btn(bx,by+72,bw,15,'GO A',()=>goCode('A'),{on:waitA&&(S.t*3|0)%2,col:'#ffcd75',key:''});
  btn(bx+bw+1,by+72,bw,15,'GO B',()=>goCode('B'),{on:waitB&&(S.t*3|0)%2,col:'#73eff7'});
  const help={mover:['CLIC: PUNTO DE RUTA','CLIC EN SOLDADO: ELEGIR','DER: DESHACER'],mirar:['CLIC: HACIA DÓNDE','MIRA AL LLEGAR AL','ÚLTIMO PUNTO'],flash:['CLIC: LANZA UN FLASH','DESDE EL ÚLTIMO PUNTO','MÁX 8 CASILLAS'],puerta:['CLIC EN PUERTA:','ABRIR > PATEAR >','PATEAR + FLASH'],despejar:['CLIC EN UNA PUERTA:','TODO EL EQUIPO SE','APILA, ENTRA Y LIMPIA'],todos:['CLIC EN EL MAPA:','TODO EL EQUIPO VA','A ESA ZONA']}[S.tool];
  help.forEach((l,i)=>T(l,bx+1,by+92+i*7,'#6b7a90',1,null));
  if(o&&!o.alive)T('OPERADOR CAÍDO',bx+1,by+115,'#ff4d6d',1,null);
  const label=!S.started?'¡EJECUTAR!':S.paused?'CONTINUAR':'PAUSA';
  btn(bx,VH-24,bw*2+1,20,label,()=>togglePause(),{on:!S.started||S.paused,col:'#a7f070'});
  /* radio log */
  S.log.forEach((l,i)=>{if(l.t<=0)return;const y=MY+GH*TS-9-i*8;const s=l.who.toUpperCase()+': '+l.s;c.globalAlpha=Math.min(1,l.t)*(1-i*.18);px(2,y-1,'#0b0d14b0',TW(s)+4,7);T(l.who.toUpperCase()+':',4,y,l.col,1,null);T(l.s,4+TW(l.who.toUpperCase()+': '),y,'#e8ecef',1,null);c.globalAlpha=1})}

/* ================= COMMANDS ================= */
function togglePause(){if(S.over)return;if(!S.started){S.started=true;S.paused=false;radio('TÚ','Equipo Halcón, ¡ejecuten!','#a7f070');return}S.paused=!S.paused;sfx('click')}
function cycleHold(){const o=S.ops[S.sel];if(!o||!o.alive)return;const w=lastWp(o,true);w.hold=w.hold===null?'A':w.hold==='A'?'B':null;sfx('click')}
function undo(){const o=S.ops[S.sel];if(!o)return;if(o.plan.length){o.plan.pop();sfx('click')}else if(o.cur||o.path.length){o.cur=null;o.path=o.path.slice(0,1);sfx('click')}else sfx('deny')}
function clearPlan(){const o=S.ops[S.sel];if(!o)return;o.order=null;o.plan=[];o.cur=null;o.path=o.path.slice(0,1);if(o.wait)o.wait=null;sfx('click')}
function mapClick(fx,fy,right){const o=S.ops[S.sel],tx=Math.floor(fx),ty=Math.floor(fy);
  if(right){if(S.tool!=='mover'){S.tool='mover';return}undo();return}
  if(S.tool==='puerta'){let best=null,bd=1.2;for(const dr of doors.values()){const d=hyp(dr.x+.5-fx,dr.y+.5-fy);if(d<bd&&dr.state===0){bd=d;best=dr}}if(best){best.mode=best.mode==='abrir'?'patear':best.mode==='patear'?'flash':'abrir';sfx('click')}else sfx('deny');return}
  if(S.tool==='despejar'){let best=null,bd=1.2;for(const dr of doors.values()){const d=hyp(dr.x+.5-fx,dr.y+.5-fy);if(d<bd){bd=d;best=dr}}const list=S.ops.filter(q=>q.alive);if(best&&orderClear(best,list)){ping(best.x+.5,best.y+.5,'#ef7d57');S.tool='mover';sfx('go')}else sfx('deny');return}
  if(S.tool==='todos'){const list=S.ops.filter(q=>q.alive);if(passable(tx,ty)&&orderGoto(list,fx,fy)){ping(fx,fy,'#a7f070');radio('TÚ','Todo el equipo a esa posición.','#a7f070');S.tool='mover';sfx('go')}else sfx('deny');return}
  if(S.tool==='mover'){for(const q of S.ops)if(q.alive&&hyp(q.x-fx,q.y-fy)<.7){S.sel=q.id;sfx('radio',1+q.id*.1);return}}
  if(!o||!o.alive){sfx('deny');return}
  if(S.tool==='mover'){if(!passable(tx,ty)){sfx('deny');return}const[lx,ly]=lastPoint(o);if(lx===tx&&ly===ty){sfx('deny');return}const p=astar(lx,ly,tx,ty);if(!p){sfx('deny');return}o.plan.push({tx,ty,nodes:p,look:null,flash:null,hold:null});o.order=null;sfx('click')}
  else if(S.tool==='mirar'){const w=lastWp(o,true);w.look=Math.atan2(fy-(w.ty+.5),fx-(w.tx+.5));sfx('click');S.tool='mover'}
  else if(S.tool==='flash'){const w=lastWp(o,true);if(!w.flash&&flashesPlanned(o)>=o.fl){sfx('deny');radio(o.n,'No me quedan flashes.',o.col);return}if(hyp(fx-(w.tx+.5),fy-(w.ty+.5))>8.5){sfx('deny');return}w.flash={x:fx,y:fy};sfx('click');S.tool='mover'}}

/* ================= INPUT ================= */
function toV(e){return[(e.clientX*dpr-VR.x)/VR.w*VW,(e.clientY*dpr-VR.y)/VR.h*VH]}
cv.addEventListener('pointermove',e=>{[mouse.x,mouse.y]=toV(e)});
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if(!S||modal.classList.contains('on'))return;[mouse.x,mouse.y]=toV(e);
  if(e.button!==2)for(let i=UI.length-1;i>=0;i--){const u=UI[i];if(mouse.x>=u.x&&mouse.x<u.x+u.w&&mouse.y>=u.y&&mouse.y<u.y+u.h){if(u.on)u.on();return}}
  if(S.over)return;
  if(mouse.x>=MX&&mouse.x<MX+GW*TS&&mouse.y>=MY&&mouse.y<MY+GH*TS){if(S.mode==='leader'){if(S.paused&&e.button===0){togglePause();return}if(e.button===2)contextCmd((mouse.x-MX)/TS,(mouse.y-MY)/TS);else S.firing=true}else mapClick((mouse.x-MX)/TS,(mouse.y-MY)/TS,e.button===2)}});
addEventListener('pointerup',()=>{if(S)S.firing=false});
const keys={};addEventListener('keyup',e=>{keys[e.code]=false});addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(S)S.firing=false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{keys[e.code]=true;if(!S||modal.classList.contains('on'))return;audioInit();const k=e.code;
  if(S.mode==='leader'){if(k==='Space'){e.preventDefault();togglePause()}else if(k==='Escape')pauseMenu();else if(S.over||S.paused){}else if(k==='KeyQ')allOrder('follow');else if(k==='KeyE')allOrder('hold');else if(k==='KeyG'){const L=S.ops[0];if(L.alive)throwFlash(L,(mouse.x-MX)/TS,(mouse.y-MY)/TS)}else if(k==='KeyF'){const L=S.ops[0];if(L.alive&&L.busy<=0)playerKick(L)}if(k.startsWith('Arrow'))e.preventDefault();return}
  if(/^Digit[1-4]$/.test(k)){S.sel=+k.slice(5)-1;sfx('radio',1+S.sel*.1)}
  else if(k==='Tab'){e.preventDefault();for(let i=1;i<=4;i++){const j=(S.sel+i)%4;if(S.ops[j].alive){S.sel=j;break}}sfx('radio')}
  else if(k==='Space'){e.preventDefault();togglePause()}
  else if(k==='KeyM')S.tool='mover';else if(k==='KeyL')S.tool=S.tool==='mirar'?'mover':'mirar';else if(k==='KeyF')S.tool=S.tool==='flash'?'mover':'flash';else if(k==='KeyP')S.tool=S.tool==='puerta'?'mover':'puerta';
  else if(k==='KeyR')S.tool=S.tool==='despejar'?'mover':'despejar';else if(k==='KeyT')S.tool=S.tool==='todos'?'mover':'todos';else if(k==='KeyC')cycleHold();else if(k==='KeyZ')undo();else if(k==='KeyX')clearPlan();
  else if(k==='KeyA'&&S.started&&!S.over)goCode('A');else if(k==='KeyB'&&S.started&&!S.over)goCode('B');
  else if(k==='Escape'){if(S.tool!=='mover')S.tool='mover';else pauseMenu()}});

/* ================= MENUS ================= */
const modal=$('modal'),box=$('box');
function open(h){box.innerHTML=h;modal.classList.add('on');if(S&&S.started&&!S.over)S.paused=true}
function close(){modal.classList.remove('on')}
function preview(mi){parse(mi);MI=mi;buildStatic();const cn=document.createElement('canvas');cn.width=GW*TS;cn.height=GH*TS;cn.getContext('2d').drawImage(staticLayer,0,0);return cn.toDataURL()}
function title(){S=null;const imgs=MISSIONS.map((m,i)=>preview(i));
  open(`<div class="title">ESCUADRÓN<br>HALCÓN</div><div class="sub">MANDO TÁCTICO</div><p>Eres el operador al mando. Planifica la entrada de tus cuatro agentes, coordina las puertas y los flashes, y da la orden. El equipo dispara solo; tú decides por dónde, cuándo y cómo entran.</p>
  <div class="list">${MISSIONS.map((m,i)=>{const lock=i>0&&save.stars[i-1]<1;return `<button class="ms ${lock?'lock':''}" data-m="${i}" ${lock?'disabled':''}><img src="${imgs[i]}" alt=""><span><b>M${i+1} · ${m.n.toUpperCase()}</b><br><span class="note">${{elim:'Neutralizar',rescue:'Rescate de rehenes',bomb:'Desactivar bomba'}[m.type]}</span><br><span class="stars">${'★'.repeat(save.stars[i])}${'☆'.repeat(3-save.stars[i])}</span>${lock?' <span class="note">Completa la anterior</span>':''}</span></button>`}).join('')}</div>
  <p class="note">★ misión cumplida · ★ nadie del equipo cae · ★ por debajo del tiempo objetivo</p>`)}
function briefing(mi){newGame(mi);const M=MISSIONS[mi];
  open(`<h2>M${mi+1} · ${M.n.toUpperCase()}</h2><p>${M.brief}</p><p class="note">${M.tip}</p>
  <ul><li><b>Clic</b> en un operador (o <kbd>1</kbd>–<kbd>4</kbd>) y luego <b>clic en el mapa</b> para trazar su ruta punto por punto.</li>
  <li><b>PUERTA</b> <kbd>P</kbd>: clic en una puerta para elegir abrir, patear o patear + flash.</li>
  <li><b>FLASH</b> <kbd>F</kbd>, <b>MIRAR</b> <kbd>L</kbd> y <b>CÓDIGO</b> <kbd>C</kbd> se aplican al último punto de la ruta. Con un código, el operador espera hasta que pulses <b>GO A</b> o <b>GO B</b> (<kbd>A</kbd>/<kbd>B</kbd>).</li>
  <li><kbd>Espacio</kbd> ejecuta o pausa. En pausa puedes seguir dando órdenes. <b>Clic derecho</b> deshace.</li></ul>
  <p><b>Órdenes rápidas:</b> <b>DESPEJAR</b> <kbd>R</kbd> + clic en una puerta y todo el equipo se apila, hace la brecha con flash y limpia el cuarto solo. <b>TODOS</b> <kbd>T</kbd> + clic manda a todo el equipo a esa zona.</p>
  <h2 style="margin-top:16px">MODO LÍDER</h2><p class="note">Controlas tú al Líder: <kbd>WASD</kbd> para moverte, ratón para apuntar y clic para disparar. <b>Clic derecho</b> da órdenes al equipo: en una puerta despejan el cuarto, en un rehén lo aseguran y en el suelo van ahí. <kbd>Q</kbd> síganme · <kbd>E</kbd> alto · <kbd>G</kbd> flash · <kbd>F</kbd> patear puerta. Si caes, la misión falla.</p>
  <div class="row"><button class="btn alt" data-act="menu">MISIONES</button><button class="btn alt" data-act="leader">MODO LÍDER</button><button class="btn" data-act="go">MANDO TÁCTICO</button></div>`)}
function pauseMenu(){if(!S||S.over)return;open(`<h2>PAUSA</h2><p>${S.M.n} · ${Math.floor(S.time)} s · ${S.kills} abatidos</p><div class="row"><button class="btn alt" data-act="menu">MISIONES</button><button class="btn alt" data-act="retry">REINICIAR</button><button class="btn" data-act="go">SEGUIR</button></div>`)}
function showResult(){const win=S.win,down=S.ops.filter(o=>!o.alive).length,st=win?1+(down===0?1:0)+(S.time<=S.M.par?1:0):0;
  if(win){save.stars[MI]=Math.max(save.stars[MI],st);store()}
  const shots=S.ops.reduce((a,o)=>a+(o.shots||0),0),hits=S.ops.reduce((a,o)=>a+(o.hits||0),0);
  open(`<h2>${win?'MISIÓN CUMPLIDA':'MISIÓN FALLIDA'}</h2><p>${S.why}</p>${win?`<p class="stars" style="font-size:26px">${'★'.repeat(st)}${'☆'.repeat(3-st)}</p>`:''}
  <div class="stat"><span>Tiempo</span><span>${Math.floor(S.time/60)}:${String(Math.floor(S.time%60)).padStart(2,'0')} (objetivo ${Math.floor(S.M.par/60)}:${String(S.M.par%60).padStart(2,'0')})</span><span>Abatidos</span><span>${S.kills}/${S.ens.length}</span><span>Operadores en pie</span><span>${4-down}/4</span><span>Precisión del equipo</span><span>${shots?Math.round(hits/shots*100):0}%</span>${S.ops.map(o=>`<span style="color:${o.col}">${o.n}</span><span>${o.alive?'':'caído · '}${o.kills} bajas</span>`).join('')}</div>
  <div class="row"><button class="btn alt" data-act="menu">MISIONES</button><button class="btn ${win?'alt':''}" data-act="retry">REINTENTAR</button>${win&&MI<MISSIONS.length-1?'<button class="btn" data-act="next">SIGUIENTE</button>':''}</div>`)}
modal.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;audioInit();sfx('click');
  if(b.dataset.m!==undefined&&!b.disabled){briefing(+b.dataset.m);return}
  const a=b.dataset.act;if(a==='leader'){newGame(MI,'leader');close()}else if(a==='go'){if(S&&S.mode==='leader'&&!S.over&&S.time>0){}close()}else if(a==='menu')title();else if(a==='retry'){briefing(MI)}else if(a==='next'){briefing(MI+1)}});

/* ================= LOOP ================= */
let last=performance.now(),acc=0;
function loop(now){const rdt=Math.min(.05,(now-last)/1000);last=now;
  if(S){if(!S.decals)S.decals=[];
    S.shake=Math.max(0,S.shake-rdt*18);S.white=Math.max(0,S.white-rdt*1.4);for(const l of S.log)l.t-=rdt;
    if(S.started&&!S.paused&&!modal.classList.contains('on')&&(!S.over||performance.now()-S.endAt<1700)){let sc=S.speed;if(S.slow>0){sc*=.35;S.slow-=rdt}acc+=rdt*sc;let n=0;while(acc>=1/60&&n<8){update(1/60);acc-=1/60;n++}if(n>=8)acc=0}
    else{S.t+=rdt*.5}
    render()}
  else{c.fillStyle='#07080d';c.fillRect(0,0,VW,VH);if(staticLayer){c.globalAlpha=.4;c.drawImage(staticLayer,MX,MY);c.globalAlpha=1}present()}
  requestAnimationFrame(loop)}
title();requestAnimationFrame(loop);
}
</script>
