<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Grutas Arcanas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: arcano, travieso, una consola de 8 bits encendida de noche
   IDEA: una gruta viva de píxeles iluminada solo por tu varita, el fuego y la lava
   PICTURE: la simulación a pantalla completa con luz difuminada (dither) estilo 8 bits
   COLOUR and TYPE: noche violeta, oro arcano de acento, fuego naranja; Press Start 2P + Pixelify Sans
   LAYOUT: HUD arriba, varita arriba a la derecha, zonas de control invisibles abajo */
:root{color-scheme:dark;--ink:#f3e9ff;--gold:#ffd23f;--gold2:#b38f1c;--panel:#160f24;--edge:#5b3fa0;--deep:#0b0712;--hp:#e8455a;--mp:#4aa3ff;--lv:#b98cff}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--deep);color:var(--ink);overflow:hidden;font:16px/1.4 "Pixelify Sans",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
body{position:fixed;inset:0}
.p2{font-family:"Press Start 2P",monospace}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;image-rendering:pixelated;display:block}
.px{box-shadow:0 0 0 2px #000,0 0 0 4px var(--edge),0 0 0 6px #000}
.hud{position:fixed;left:12px;right:12px;top:12px;display:flex;gap:14px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.left{display:grid;gap:7px;width:min(42vw,190px)}
.bar{position:relative;height:12px;background:#000;box-shadow:0 0 0 2px #000,0 0 0 3px #ffffff30}
.bar i{display:block;height:100%;width:100%;transition:width .12s linear}
.bar.hp i{background:linear-gradient(#ff7a8a 0 30%,var(--hp) 30%)}
.bar.mp i{background:linear-gradient(#9fd0ff 0 30%,var(--mp) 30%)}
.bar.lv{height:7px}.bar.lv i{background:var(--lv)}
.bar span{position:absolute;right:3px;top:1px;font:8px/1 "Press Start 2P",monospace;color:#fff;text-shadow:1px 1px 0 #000}
.meta{font-size:14px;text-shadow:2px 2px 0 #000;line-height:1.25}
.meta b{color:var(--gold);font:11px "Press Start 2P",monospace}
.right{display:grid;gap:10px;justify-items:end;pointer-events:auto}
.row{display:flex;gap:8px}
.ib{font:10px/1 "Press Start 2P",monospace;color:var(--ink);background:var(--panel);border:0;min-width:44px;height:40px;padding:0 10px;cursor:pointer;box-shadow:0 0 0 2px #000,0 0 0 4px var(--edge),inset 0 -3px 0 #00000080}
.ib:active{transform:translateY(2px)}
#strip{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;max-width:min(54vw,250px);background:var(--panel);padding:4px;cursor:pointer;position:relative}
#strip .c{width:26px;height:26px;display:grid;place-items:center;background:#0b0712;box-shadow:inset 0 0 0 2px #2a2040}
#strip .c.on{box-shadow:inset 0 0 0 2px var(--gold)}
#strip img,.card img,.cell img{image-rendering:pixelated;width:20px;height:20px}
#reload{position:absolute;left:0;bottom:-6px;height:3px;background:var(--gold)}
#toast{position:fixed;left:50%;top:30%;transform:translateX(-50%);font:12px/1.5 "Press Start 2P",monospace;text-align:center;color:var(--gold);text-shadow:2px 2px 0 #000;opacity:0;transition:opacity .3s;pointer-events:none;width:90vw}
#toast.on{opacity:1}
#toast small{display:block;font:15px "Pixelify Sans";color:var(--ink)}
.hint{position:fixed;bottom:20px;font-size:15px;opacity:.8;text-shadow:2px 2px 0 #000;pointer-events:none;transition:opacity 1s;max-width:44vw}
.hint.l{left:16px}.hint.r{right:16px;text-align:right}.hint.off{opacity:0}
.modal{position:fixed;inset:0;background:#05030ad9;display:none;place-items:center;padding:14px;z-index:9}
.modal.on{display:grid}
.box{background:var(--panel);width:min(480px,100%);max-height:calc(100vh - 28px);overflow:auto;padding:18px;box-shadow:0 0 0 3px #000,0 0 0 6px var(--edge),0 0 0 9px #000,0 12px 0 9px #00000080}
.box h2{font:18px/1.3 "Press Start 2P",monospace;color:var(--gold);margin:0 0 10px;text-shadow:3px 3px 0 #000}
.box h3{font:11px/1.3 "Press Start 2P",monospace;margin:14px 0 8px;color:#cdb8ff}
.box p{margin:6px 0}
.box ul{margin:8px 0;padding-left:18px}
.title{font:clamp(22px,7vw,36px)/1.15 "Press Start 2P",monospace;color:var(--gold);text-shadow:4px 4px 0 #5b3fa0,8px 8px 0 #000;margin:4px 0 14px;text-align:center}
.btn{font:11px/1 "Press Start 2P",monospace;color:#1b1428;background:var(--gold);border:0;min-height:44px;padding:0 16px;cursor:pointer;box-shadow:0 0 0 2px #000,inset -3px -3px 0 var(--gold2),inset 3px 3px 0 #fff0a8}
.btn.ghost{background:#2e2150;color:var(--ink);box-shadow:0 0 0 2px #000,inset -3px -3px 0 #1a1230,inset 3px 3px 0 #4a3a78}
.btn:active,.ib:active{filter:brightness(1.1)}
.btn:focus-visible,.ib:focus-visible,.cell:focus-visible,.card:focus-visible,.tab:focus-visible{outline:3px solid #fff;outline-offset:3px}
.actions{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.stack{display:grid;gap:12px;margin-top:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{font:9px/1 "Press Start 2P",monospace;color:var(--ink);background:#0b0712;border:0;padding:10px 10px;min-height:36px;cursor:pointer;box-shadow:inset 0 0 0 2px #2a2040}
.tab.on{background:#2e2150;box-shadow:inset 0 0 0 2px var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 10px;font-size:14px;background:#0b0712;padding:8px}
.stats b{display:block;font:10px "Press Start 2P",monospace;color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px}
.cell{aspect-ratio:1;display:grid;place-items:center;border:0;cursor:pointer;padding:0;background:#0b0712;box-shadow:inset 0 0 0 2px #2a2040}
.cell img{width:26px;height:26px}
.cell.p{background:#1c2a52}.cell.m{background:#3e2052}.cell.u{background:#1d4a32}
.cell.sel{box-shadow:inset 0 0 0 3px var(--gold)}
.info{min-height:62px;background:#0b0712;padding:8px 10px;margin:8px 0;font-size:15px}
.info b{color:var(--gold)}
.tag{font:8px "Press Start 2P",monospace;padding:3px 5px;margin-left:6px;vertical-align:middle;background:#2e2150}
.tag.p{background:#2a4a9a}.tag.m{background:#7a3a9a}.tag.u{background:#2a8a5a}
.cards{display:grid;gap:8px}
.card{display:flex;gap:12px;align-items:center;text-align:left;border:0;color:var(--ink);font:inherit;cursor:pointer;padding:10px;background:#0b0712;box-shadow:inset 0 0 0 2px #2a2040;min-height:56px}
.card:hover{box-shadow:inset 0 0 0 2px var(--gold)}
.card .ico{width:40px;height:40px;flex:none;display:grid;place-items:center}
.card .ico img{width:30px;height:30px}
.card small{display:block;opacity:.75;font-size:14px}
.card.dim{opacity:.55}
.note{font-size:13px;opacity:.7}
@media(max-height:600px){.box{padding:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="hud">
  <div class="left">
    <div class="bar hp"><i id="hpB"></i><span id="hpT">100</span></div>
    <div class="bar mp"><i id="mpB"></i></div>
    <div class="bar lv"><i id="lvB"></i></div>
    <div class="meta"><b id="goldT">0</b> oro<br><span id="bioT">Minas Olvidadas</span> · <span id="depthT">0 m</span></div>
  </div>
  <div class="right">
    <div class="row">
      <button class="ib" id="swapB" aria-label="Cambiar varita">V1</button>
      <button class="ib" id="bagB">BOLSA</button>
      <button class="ib" id="pauseB" aria-label="Pausa">II</button>
    </div>
    <div id="strip" aria-label="Varita actual"><div id="reload"></div></div>
  </div>
</div>
<div id="toast"></div>
<div class="hint l" id="hl">Arrastra aquí para moverte.<br>Empuja arriba para levitar.</div>
<div class="hint r" id="hr">Mantén el dedo aquí para apuntar y lanzar.</div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>

<script>
{
const R=Math.random,pick=a=>a[R()*a.length|0],clamp=(v,a,b)=>v<a?a:v>b?b:v;

const mat=new Uint8Array(N),life=new Uint8Array(N),shade=new Uint8Array(N),stamp=new Uint8Array(N);

const SOLID=tbl([ROCK,DIRT,SAND,WOOD,ICE,CRYS]),STATIC=tbl([ROCK,DIRT,WOOD,ICE,CRYS]),GAS=tbl([E,SMOKE]),POW=tbl([E,SMOKE,FIRE,WATER,OIL,ACID]),LIQ=tbl([WATER,LAVA,OIL,ACID]);
const DENS=new Uint8Array(16);DENS[OIL]=2;DENS[WATER]=3;DENS[ACID]=4;DENS[LAVA]=5;

let F=0;
const set=(i,m,l)=>{mat[i]=m;life[i]=l||0;shade[i]=R()*4|0;stamp[i]=F};
function swp(a,b){const m=mat[a],l=life[a],s=shade[a];mat[a]=mat[b];life[a]=life[b];shade[a]=shade[b];mat[b]=m;life[b]=l;shade[b]=s;stamp[a]=F;stamp[b]=F}
const circle=(cx,cy,r,fn)=>{cx|=0;cy|=0;for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r&&inb(cx+x,cy+y))fn((cy+y)*WW+cx+x,x*x+y*y)};
const biomeAt=y=>y<160?0:y<320?1:2;

/* ================= COLOURS ================= */
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const pk=(r,g,b)=>(255<<24|b<<16|g<<8|r)>>>0,pkh=h=>pk(...hx(h));

const COLB=BIOMES.map(b=>{const t=new Uint32Array(64);for(const m in COMMON)shades(COMMON[m]).forEach((c,s)=>t[m*4+s]=c);shades(b.rock).forEach((c,s)=>t[ROCK*4+s]=c);shades(b.dirt).forEach((c,s)=>t[DIRT*4+s]=c);return t});
const TOPC=BIOMES.map(b=>pkh(b.top)),ROCKTOP=BIOMES.map(b=>shades(b.rock,[1.4])[0]),BGC=BIOMES.map(b=>b.bg.map(pkh));

const BAY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
/* parallax background noise */
const BGH=640,BGN=new Uint8Array(WW*BGH);
(function(){const vn=(cell)=>{const gw=Math.ceil(WW/cell)+2,gh=Math.ceil(BGH/cell)+2,g=Float32Array.from({length:gw*gh},()=>R()),o=new Float32Array(WW*BGH);
  for(let y=0;y<BGH;y++)for(let x=0;x<WW;x++){const fx=x/cell,fy=y/cell,ix=fx|0,iy=fy|0,tx=fx-ix,ty=fy-iy,sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty),a=g[iy*gw+ix],b=g[iy*gw+ix+1],c=g[(iy+1)*gw+ix],d=g[(iy+1)*gw+ix+1];o[y*WW+x]=a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy}return o};
  const a=vn(14),b=vn(5);for(let y=0;y<BGH;y++)for(let x=0;x<WW;x++){const i=y*WW+x,v=a[i]*.7+b[i]*.3+(BAY[(y&3)*4+(x&3)]/16-.5)*.18;BGN[i]=v<.42?0:v<.6?1:2}})();

const S={

function collides(x,y,w,h){for(let cy=Math.floor(y);cy<=Math.floor(y+h-.01);cy++)for(let cx=Math.floor(x);cx<=Math.floor(x+w-.01);cx++){if(!inb(cx,cy))return true;if(SOLID[mat[cy*WW+cx]])return true}return false}
function phys(e,dt,step){

    if(dy){if(!collides(e.x,e.y+dy,e.w,e.h))e.y+=dy;else{if(dy>0)e.ground=true;e.vy=0;dy=0}}
  }

}

  for(let it=0;it<5;it++){const n=new Uint8Array(g.length);
    for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){let c=0;for(let j=-1;j<=1;j++)for(let k=-1;k<=1;k++){const X=x+k,Y=y+j;c+=(X<0||Y<0||X>=GW||Y>=GH)?1:g[Y*GW+X]}n[y*GW+x]=c>=5?1:0}g=n}
  const kind=new Uint8Array(GW*GH);for(let i=0;i<kind.length;i++)kind[i]=R()<[.3,.42,.58][biomeAt((i/GW|0)*C)]?ROCK:DIRT;
  for(let y=0;y<WH;y++)for(let x=0;x<WW;x++){const gx=x/C|0,gy=y/C|0,gi=gy*GW+gx,i=y*WW+x;
    if(g[gi]){let m=kind[gi];const edge=[[1,0],[-1,0],[0,1],[0,-1]].some(([a,b])=>{const X=gx+a,Y=gy+b;return X>=0&&Y>=0&&X<GW&&Y<GH&&!g[Y*GW+X]});

  const emptyAt=(y0,y1)=>{let x,y,t=0;do{x=3+R()*(WW-6)|0;y=y0+R()*(y1-y0)|0}while(mat[y*WW+x]&&++t<500);return[x,y]};
  const blob=(n,y0,y1,r0,r1,m,onSolid)=>{for(let k=0;k<n;k++){const[x,y]=onSolid?solidAt(y0,y1):emptyAt(y0,y1);circle(x,y,r0+(R()*(r1-r0+1)|0),i=>{if(onSolid?SOLID[mat[i]]:!mat[i])set(i,m)})}};
  /* minas */

  for(let k=0;k<12;k++){const[x,y]=emptyAt(30,160);const L=8+R()*14|0;for(let j=0;j<L;j++){const X=x+j-(L>>1);for(let t=0;t<2;t++)if(inb(X,y+t)&&!SOLID[mat[(y+t)*WW+X]])set((y+t)*WW+X,WOOD)}
    for(const bx of[x-(L>>1)+1,x+(L>>1)-2])for(let t=2;t<14;t++){const Y=y+t;if(!inb(bx,Y)||SOLID[mat[Y*WW+bx]])break;set(Y*WW+bx,WOOD)}}
  /* cripta */
  blob(6,165,320,3,4,ACID,0);blob(16,165,320,2,3,CRYS,1);blob(3,165,320,4,5,WATER,0);blob(6,165,320,3,5,SAND,1);blob(10,165,320,1,2,GOLD,1);
  /* fundicion */
  blob(7,330,WH-40,4,6,LAVA,0);blob(6,330,WH-40,3,4,OIL,0);blob(14,330,WH-40,1,2,GOLD,1);blob(4,330,WH-40,3,5,SAND,1);blob(5,330,WH-40,2,2,CRYS,1);
  for(let y=4;y<27;y++)for(let x=30;x<82;x++)set(y*WW+x,E);
  for(let x=30;x<82;x++){set(27*WW+x,DIRT);set(28*WW+x,DIRT)}
  for(let y=WH-26;y<WH-2;y++)for(let x=1;x<WW-1;x++)set(y*WW+x,E);
  for(let x=0;x<WW;x++){set(x,ROCK);set((WH-1)*WW+x,ROCK);set((WH-2)*WW+x,ROCK)}
  for(let y=0;y<WH;y++){set(y*WW,ROCK);set(y*WW+WW-1,ROCK)}
  for(let y=0;y<WH;y++)for(let x=0;x<WW;x++){const i=y*WW+x;if(mat[i]===ROCK)shade[i]=((x>>1)*7+(y>>1)*13+((x>>1)^(y>>1))*5)&3;if(mat[i]===WOOD)shade[i]=y%3===0?3:x&1}
}

/* ================= SIMULATION ================= */
function sim(y0,y1){
  F=F%255+1;if(F===1)stamp.fill(0);
  y0=Math.max(1,y0);y1=Math.min(WH-2,y1);
  for(let y=y1;y>=y0;y--){const ltr=(F+y)&1,row=y*WW;
    for(let k=1;k<WW-1;k++){const x=ltr?k:WW-1-k,i=row+x,m=mat[i];
      if(!m||STATIC[m]||stamp[i]===F)continue;
      const b=i+WW,d=R()<.5?-1:1;
      if(m===SAND||m===GOLD){if(POW[mat[b]])swp(i,b);else if(POW[mat[b+d]])swp(i,b+d);else if(POW[mat[b-d]])swp(i,b-d)}
      else if(LIQ[m]){
        if(m===LAVA){if(F&1)continue;
          for(const n of[i-1,i+1,i-WW,b]){const q=mat[n];if(q===WATER){set(i,ROCK);set(n,SMOKE,40);break}if(q===ICE)set(n,WATER);else if((q===WOOD||q===OIL)&&R()<.2)set(n,FIRE,60)}
          if(mat[i]!==LAVA)continue}
        else if(m===ACID){let gone=false;for(const n of[i-1,i+1,b]){const q=mat[n];if(q&&q!==ACID&&q!==CRYS&&q!==LAVA&&!GAS[q]&&q!==FIRE&&(q!==ROCK||R()<.25)&&R()<.05&&n%WW>0&&n%WW<WW-1&&n<N-2*WW){set(n,E);if(R()<.4){set(i,SMOKE,20);gone=true;break}}}if(gone)continue}
        const dm=DENS[m],dn=j=>{const q=mat[j];return GAS[q]||q===FIRE||(LIQ[q]&&DENS[q]<dm)};
        if(dn(b))swp(i,b);else if(dn(b+d))swp(i,b+d);else if(dn(b-d))swp(i,b-d);
        else{const sp=m===LAVA?1:m===OIL?3:2;let j=i;for(let s=0;s<sp&&GAS[mat[j+d]];s++)j+=d;if(j===i)for(let s=0;s<sp&&GAS[mat[j-d]];s++)j-=d;if(j!==i)swp(i,j)}
      }else if(m===FIRE){
        const l=life[i]-1;if(l<=0){if(R()<.45)set(i,SMOKE,20+R()*30|0);else set(i,E);continue}life[i]=l;let out=false;
        for(const n of[i-1,i+1,i-WW,b]){const q=mat[n];if(q===WOOD&&R()<.03)set(n,FIRE,70+R()*90|0);else if(q===OIL&&R()<.25)set(n,FIRE,40+R()*40|0);else if(q===ICE&&R()<.02)set(n,WATER);else if(q===WATER){set(i,SMOKE,25);out=true;break}}
        if(!out&&R()<.55){const u=i-WW+(R()*3|0)-1;if(GAS[mat[u]])swp(i,u)}
      }else if(m===SMOKE){const l=life[i]-1;if(l<=0){set(i,E);continue}life[i]=l;const u=i-WW+(R()*3|0)-1;if(!mat[u])swp(i,u)}
    }
  }
}

/* ================= CASTING ================= */
function buildOrder(w){const idx=[];w.slots.forEach((s,i)=>{if(s)idx.push(i)});if(w.shuffle)for(let i=idx.length-1;i>0;i--){const j=R()*(i+1)|0;[idx[i],idx[j]]=[idx[j],idx[i]]}w.order=idx;w.pos=0}
function drawN(w,n,c,depth){
  const out=[];let mods=[];
  while(n>0){
    if(w.pos>=w.order.length){if(c.wrapped||!w.order.length)break;c.wrapped=true;w.pos=0}
    if(c.taken++>=w.order.length*2)break;
    const id=w.slots[w.order[w.pos++]];if(!id)continue;const s=S[id];c.mana+=s.m;c.delay+=s.dl||0;c.rech+=s.rc||0;
    if(s.t==='m'){if(s.draw)n+=s.draw;else mods.push(id);continue}
    const spec={id,mods:mods.filter(m=>!S[m].trig)},tr=mods.find(m=>S[m].trig);
    if(tr&&depth<3){spec.trig=S[tr].trig;spec.payload=drawN(w,1,c,depth+1)}
    mods=mods.filter(m=>!S[m].trig);out.push(spec);n--;
  }
  return out;
}
function tryCast(){
  const w=wands[cw];if(!w.order)buildOrder(w);if(!w.order.length){castT=.3;return}
  const save=w.pos,c={mana:0,delay:w.delay,rech:0,wrapped:false,taken:0},list=drawN(w,1,c,0);

  if(k.k==='heart'){P.hp=Math.min(100,P.hp+25);floatTxt(P.x+2,P.y-3,'+25','#8ef04a');k.gone=true}
  else if(k.k==='spell'){if(addInv(k.id)){k.gone=true;toast('NUEVO HECHIZO',S[k.id].n)}else{k.cool=2;toast('BOLSA LLENA')}}
  else if(k.k==='chest'){k.gone=true;burst(k.x+3,k.y+2,16,pkh('#ffd23f'));chestMenu()}
  else if(k.k==='wand'){k.cool=2;wandFound(k)}
}

const SPR={

  mageP:pal({h:'#7d4ee0',H:'#4b2a9a',s:'#f1c69b',e:'#1b1428',r:'#6a3fd0',b:'#ffd23f',R:'#2a1a50'}),

  wisp:[I('..c..|.ccc.|ccwcc|cwwwc|.ccc.|..c..'),I('.....|..c..|.cwc.|cwwwc|.ccc.|.c.c.')],
  wispP:pal({c:'#6fe3ff',w:'#e8fdff'}),
  golem:[I('..kkkk..|.kKKKKk.|.kKoKoK.|.kKKKKk.|kkkkkkkk|kKkkkkKk|kK.kk.Kk|...kk...|..kk.kk.'),I('..kkkk..|.kKKKKk.|.kKoKoK.|.kKKKKk.|kkkkkkkk|kKkkkkKk|kK.kk.Kk|...kk...|.kk...kk')],
  golemP:pal({k:'#6b5a5a',K:'#8a7676',o:'#ff9a1f'}),
  chest:I('.wwwww.|wWWyWWw|wwwywww|wWWWWWw|wwwwwww'),chestP:pal({w:'#8d5a2e',W:'#b07a3e',y:'#ffd23f'}),
  heart:I('.a.a.|aaaaa|.aaa.|..a..'),heartP:pal({a:'#ff4d6d'}),

  cloud:I('...aaaa.....|.aaaaaaaa...|aaaabaaaaaa.|aaaaaaaaaaaa|.bbbbbbbbbb.'),cloudP:pal({a:'#a8a8b8',b:'#6a6a7a'})
};
const WHITE=pkh('#ffffff'),FROZ=pkh('#a8dcf0'),PORTAL=['#e2c8ff','#b98cff','#7d4ee0','#4b2a9a'].map(pkh);
let cy0=0;
function plot(x,y,c,g){x=Math.round(x);y=Math.round(y)-cy0;if(x<0||y<0||x>=WW||y>=viewH)return;const o=y*WW+x;u32[o]=c;if(g)em[o]=1}
function spr(rows,P2,x,y,flip,glow,tint){x=Math.round(x);y=Math.round(y);const w=rows[0].length;for(let r=0;r<rows.length;r++)for(let c=0;c<w;c++){const ch=rows[r][flip?w-1-c:c];if(ch==='.')continue;plot(x+c,y+r,tint||P2[ch],glow)}}
function line(x0,y0,x1,y1,c,g){const d=Math.max(Math.abs(x1-x0),Math.abs(y1-y0))|0;for(let t=0;t<=d;t++)plot(x0+(x1-x0)*t/(d||1),y0+(y1-y0)*t/(d||1),c,g)}
function addL(wx,wy,r,s){const sx=wx,sy=wy-cy0,g0x=Math.max(0,((sx-r)/4)|0),g1x=Math.min(LW-1,((sx+r)/4)|0),g0y=Math.max(0,((sy-r)/4)|0),g1y=Math.min(LH-1,((sy+r)/4)|0);
  for(let gy=g0y;gy<=g1y;gy++)for(let gx=g0x;gx<=g1x;gx++){const d=Math.hypot(gx*4+2-sx,gy*4+2-sy);if(d<r)light[gy*LW+gx]+=s*(1-d/r)}}
function render(t){
  const cy=cy0=camY|0,bgo=(camY*.55)|0;em.fill(0);
  for(let gy=0;gy<LH;gy++){const wy=cy+gy*4;const a=wy<34?.6:BIOMES[biomeAt(Math.min(WH-1,wy))].amb;for(let gx=0;gx<LW;gx++)light[gy*LW+gx]=a}
  for(let y=0;y<viewH;y++){const wy=y+cy,o=y*WW;
    if(wy>=WH){u32.fill(BGC[2][0],o,o+WW);continue}
    const bi=biomeAt(wy),C=COLB[bi],row=wy*WW,bgr=((y+bgo)%BGH)*WW,lrow=(y>>2)*LW;
    for(let x=0;x<WW;x++){const i=row+x,m=mat[i];let c;
      if(!m)c=BGC[bi][BGN[bgr+x]];
      else{switch(m){
        case FIRE:c=FIREC[R()*4|0];em[o+x]=1;break;
        case LAVA:c=LAVAC[(shade[i]+(t/170|0)+(x>>2))&3];em[o+x]=1;break;
        case CRYS:c=CRYC[(shade[i]+((t/500+x*.3+wy*.2)|0))&3];em[o+x]=1;break;
        case WATER:c=GAS[mat[i-WW]]?WTOP:C[m*4+shade[i]];break;
        case OIL:c=GAS[mat[i-WW]]?OTOP:C[m*4+shade[i]];break;
        case ACID:c=GAS[mat[i-WW]]?ATOP:C[m*4+shade[i]];em[o+x]=1;break;
        case GOLD:c=((i*7+(t/90|0))%53===0)?GOLDW:C[m*4+shade[i]];break;
        case ROCK:c=!mat[i-WW]?ROCKTOP[bi]:C[m*4+shade[i]];break;
        case DIRT:c=(!mat[i-WW]||(!mat[i-2*WW]&&shade[i]<2))?TOPC[bi]:C[m*4+shade[i]];break;
        case WOOD:c=shade[i]===3?WOODD:C[m*4+shade[i]];break;
        default:c=C[m*4+shade[i]]}
        if(EMIT[m])light[lrow+(x>>2)]+=EMIT[m]}
      u32[o+x]=c}}
  /* portal */
  const px=WW/2,py=WH-14;if(py-cy<viewH+12){for(let r=7;r>=0;r--){const c=PORTAL[(r+(t/120|0))&3];for(let a=0;a<24;a++){const an=a/24*Math.PI*2;plot(px+Math.cos(an)*r*.7,py+Math.sin(an)*r,c,1)}}addL(px,py,30,1)}
  /* pickups */
  for(const k of pickups){const bob=Math.sin(k.ph*3)>0?0:1;
    if(k.k==='chest'){spr(SPR.chest,SPR.chestP,k.x,k.y,0,0);addL(k.x+3,k.y,14,.4)}
    else if(k.k==='heart'){spr(SPR.heart,SPR.heartP,k.x,k.y-bob,0,1);addL(k.x+2,k.y,10,.35)}
    else if(k.k==='spell'){const s=S[k.id],fc=pkh(s.t==='p'?'#4a7aff':s.t==='m'?'#c46aff':'#4adf8a');spr(SPR.card,{f:fc,c:ICONPX[k.id]},k.x,k.y-bob,0,1);addL(k.x+3,k.y+3,14,.6)}
    else if(k.k==='wand'){line(k.x,k.y+3-bob,k.x+7,k.y-bob,pkh('#8d5a2e'),0);plot(k.x+8,k.y-1-bob,pkh(k.wand.gem),1);plot(k.x+7,k.y-1-bob,pkh(k.wand.gem),1);addL(k.x+7,k.y,16,.7)}}
  /* enemies */
  for(const e of enemies){const f=((t/160+e.ph)|0)&1,tint=e.hit>0?WHITE:e.frozen>0?FROZ:0,fl=P.x<e.x;
    spr(SPR[e.type][f],SPR[e.type+'P'],e.x-(e.type==='bat'?1:0),e.y,fl,e.type==='wisp',tint);
    if(e.type==='wisp')addL(e.x+2,e.y+3,14,.55);if(e.type==='golem')addL(e.x+4,e.y+2,8,.2);
    if(e.hp<e.hpMax){const w=Math.max(1,Math.round(e.w*e.hp/e.hpMax));for(let x=0;x<e.w;x++)plot(e.x+x,e.y-2,x<w?pkh('#e8455a'):pkh('#2a1a20'),1)}}
  /* player */
  if(!over&&!(P.inv>0&&(t/70|0)%2)){const fr=Math.abs(P.vx)>4&&P.ground?(P.walk/3|0)&1:0;spr(SPR.mage[fr],SPR.mageP,P.x-1.5,P.y-1,P.face<0,0);
    const hx=P.x+2+P.face*2,hy=P.y+6,w=wands[cw];line(hx,hy,hx+P.ax*5,hy+P.ay*5,pkh('#8d5a2e'),0);plot(hx+P.ax*6,hy+P.ay*6,pkh(w.gem),1)}
  addL(P.x+2,P.y+5,38,.95);
  for(const p of projs){const s=S[p.id],c1=pkh(s.c[1]),c0=pkh(s.c[0]);
    if(s.saw){const f=(p.age*20|0)&1;for(let a=-2;a<=2;a++){plot(p.x+a,p.y+(f?a:-a),c1,1);plot(p.x+(f?0:a),p.y+(f?a:0),c0,1)}}
    else if(s.hole){for(let a=0;a<12;a++){const an=a/12*6.28+p.age*6;plot(p.x+Math.cos(an)*3,p.y+Math.sin(an)*3,pkh('#b98cff'),1)}plot(p.x,p.y,pkh('#000000'),1)}
    else if(p.id==='burbuja'){for(let a=0;a<8;a++){const an=a/8*6.28;plot(p.x+Math.cos(an)*2,p.y+Math.sin(an)*2,c1,1)}}
    else{const sz=s.boom||s.spawn?2:1;for(let yy=-sz+1;yy<sz;yy++)for(let xx=-sz+1;xx<sz;xx++)plot(p.x+xx,p.y+yy,c1,1);plot(p.x-p.vx*.012,p.y-p.vy*.012,c0,1);
      if(p.id==='bomba'&&((p.age*10)|0)%2)plot(p.x,p.y-2,pkh('#ff4d4d'),1)}
    addL(p.x,p.y,s.boom?18:12,.6)}
  for(const b of ebul){plot(b.x,b.y,pkh('#e8fdff'),1);plot(b.x+1,b.y,pkh('#6fe3ff'),1);plot(b.x,b.y+1,pkh('#6fe3ff'),1);addL(b.x,b.y,10,.5)}
  for(const c of clouds){spr(SPR.cloud,SPR.cloudP,c.x-6,c.y-2,0,0)}
  for(const f of fx){for(let k=1;k<f.pts.length;k++)line(f.pts[k-1][0],f.pts[k-1][1],f.pts[k][0],f.pts[k][1],f.c,1);const m=f.pts[f.pts.length-1];addL(m[0],m[1],20,.8)}
  for(const p of parts)plot(p.x,p.y,p.c,p.glow);
  for(const f of flashes)addL(f.x,f.y,f.r,1.4*f.t/f.m);
  /* lighting: blur + dithered quantised multiply */
  for(let pass=0;pass<2;pass++){for(let y=0;y<LH;y++)for(let x=0;x<LW;x++){const i=y*LW+x;light2[i]=(light[i]*2+(x>0?light[i-1]:light[i])+(x<LW-1?light[i+1]:light[i]))/4}
    for(let y=0;y<LH;y++)for(let x=0;x<LW;x++){const i=y*LW+x;light[i]=(light2[i]*2+(y>0?light2[i-LW]:light2[i])+(y<LH-1?light2[i+LW]:light2[i]))/4}}
  for(let y=0;y<viewH;y++){const gy=y/4-.5,iy=Math.max(0,gy|0),fy=clamp(gy-iy,0,1),r0=iy*LW,r1=Math.min(LH-1,iy+1)*LW,o=y*WW,by=(y&3)*4;
    for(let x=0;x<WW;x++){const gx=x/4-.5,ix=Math.max(0,gx|0),fxx=clamp(gx-ix,0,1),ix1=Math.min(LW-1,ix+1);
      const L=(light[r0+ix]*(1-fxx)+light[r0+ix1]*fxx)*(1-fy)+(light[r1+ix]*(1-fxx)+light[r1+ix1]*fxx)*fy;
      let q=Math.floor(L*6+BAY[by+(x&3)]/16)/6;if(em[o+x])q=Math.max(1,q);q=Math.min(1.2,q);if(q===1)continue;
      const c=u32[o+x];u32[o+x]=pk(Math.min(255,(c&255)*q),Math.min(255,(c>>8&255)*q),Math.min(255,(c>>16&255)*q))}}
  bctx.putImageData(imgD,0,0);
  ctx.imageSmoothingEnabled=false;ctx.setTransform(1,0,0,1,0,0);
  const sx=shake?(R()-.5)*shake*dpr:0,sy=shake?(R()-.5)*shake*dpr:0;
  ctx.drawImage(buf,0,0,WW,viewH,sx,sy-(camY%1)*scale,cv.width,viewH*scale);
  if(hurtFlash>0){ctx.fillStyle=`rgba(232,69,90,${hurtFlash})`;ctx.fillRect(0,0,cv.width,cv.height)}
  ctx.font=`${8*dpr}px "Press Start 2P",monospace`;ctx.textAlign='center';
  for(const f of floats){const X=f.x*scale,Y=(f.y-camY)*scale;ctx.globalAlpha=Math.min(1,f.t*2);ctx.fillStyle='#000';ctx.fillText(f.txt,X+2*dpr,Y+2*dpr);ctx.fillStyle=f.c;ctx.fillText(f.txt,X,Y)}ctx.globalAlpha=1;
  if(joy.id!==null){const u=4*dpr;ctx.fillStyle='#ffffff30';for(let a=0;a<28;a++){const an=a/28*6.28;ctx.fillRect(joy.ox*dpr+Math.cos(an)*50*dpr-u/2,joy.oy*dpr+Math.sin(an)*50*dpr-u/2,u,u)}
    ctx.fillStyle='#ffffff55';const kx=(joy.ox+joy.x*50)*dpr,ky=(joy.oy+joy.y*50)*dpr;ctx.fillRect(kx-18*dpr,ky-18*dpr,36*dpr,36*dpr);ctx.fillStyle='#ffffff30';ctx.fillRect(kx-12*dpr,ky-12*dpr,24*dpr,24*dpr)}
}

/* ================= HUD ================= */
let lastStrip='';
function hud(){
  const w=wands[cw];$('hpB').style.width=P.hp+'%';$('hpT').textContent=Math.ceil(P.hp);$('mpB').style.width=(w.mana/w.mmax*100)+'%';$('lvB').style.width=P.lv+'%';
  $('goldT').textContent=P.gold||0;$('depthT').textContent=Math.max(0,(P.y-17)/4|0)+' m';$('bioT').textContent=BIOMES[biomeAt(P.y)].n;$('swapB').textContent='V'+(cw+1);
  const nxt=w.order&&w.order[w.pos],html=w.slots.map((s,i)=>`<span class="c${i===nxt?' on':''}">${s?img(s):''}</span>`).join('');
  if(html!==lastStrip){lastStrip=html;$('strip').innerHTML=html+'<div id="reload"></div>'}
  const rl=$('reload');if(rl)rl.style.width=(w.reload>0?(1-w.reload/w.reloadMax)*100:0)+'%';
}

/* ================= MENUS ================= */
const modal=$('modal'),box=$('box');
function open(html){box.innerHTML=html;modal.classList.add('on');paused=true;release()}
function close(){modal.classList.remove('on');paused=false;lastStrip=''}
function title(){open(`<div class="title">GRUTAS<br>ARCANAS</div>
<p>Baja por tres zonas de una gruta viva hasta el portal del fondo. Cada expedición es distinta: el mapa, tus varitas, los cofres y los hechizos que encuentras salen al azar.</p>
<ul><li><b>Mitad izquierda:</b> arrastra para moverte y empuja arriba para levitar.</li><li><b>Mitad derecha:</b> mantén el dedo donde quieras apuntar y la varita dispara sola.</li><li><b>Bolsa:</b> organiza hechizos en tus varitas. El orden importa.</li></ul>
<p class="note">Computadora: A/D moverse · W levitar · clic sostenido lanzar · Q cambiar varita · E bolsa.</p>
<div class="actions"><button class="btn ghost" data-grim>GRIMORIO</button><button class="btn ghost" data-lab>LABORATORIO</button><button class="btn" data-new>JUGAR</button></div>
<p class="note">Laboratorio: empiezas con los ${IDS.length} hechizos para experimentar combinaciones.</p>`)}
let edTab=0,sel=null,grimFrom='title';
function wandStats(w){return `<div class="stats"><div>Retraso<b>${w.delay.toFixed(2)}s</b></div><div>Recarga<b>${w.rech.toFixed(2)}s</b></div><div>Maná<b>${w.mmax}</b></div><div>Regenera<b>${w.regen}/s</b></div><div>Dispersión<b>${w.spread}°</b></div><div>Barajar<b>${w.shuffle?'SÍ':'NO'}</b></div></div>`}
function cellHTML(id,where,i){const s=id&&S[id],on=sel&&sel.w===where&&sel.i===i;return `<button class="cell ${s?s.t:''}${on?' sel':''}" data-w="${where}" data-i="${i}" aria-label="${s?s.n:'vacío'}">${s?img(id):''}</button>`}
function info(id){if(!id)return '<span class="note">Toca un hechizo para verlo. Toca otra casilla para moverlo o intercambiarlo.</span>';const s=S[id];return `<b>${s.n}</b><span class="tag ${s.t}">${TYPE[s.t]}</span> <span class="note">${s.m} maná${s.dl?` · ${s.dl>0?'+':''}${s.dl}s`:''}</span><br>${s.d}`}

function chestMenu(){const b=biomeAt(P.y),ch=[];while(ch.length<3){const id=randSpell(Math.min(2,b+1));if(!ch.includes(id))ch.push(id)}

let pendingWand=null;

  open(`<h2>VARITA NUEVA</h2><p><b style="color:${w.gem}">◆</b> ${w.name}</p>${wandStats(w)}<h3>RANURAS (${w.cap})</h3><div class="grid">${w.slots.map(s=>`<span class="cell ${s?S[s].t:''}">${s?img(s):''}</span>`).join('')}</div>

function pause(){if(over||modal.classList.contains('on'))return;open(`<h2>PAUSA</h2><p>${$('bioT').textContent} · ${$('depthT').textContent} · ${P.gold||0} oro · ${stats.kills} enemigos</p>

  :`<h2>CAÍSTE…</h2><p>Llegaste a ${$('depthT').textContent} en ${$('bioT').textContent}. Cada gruta es distinta: prueba otra combinación.</p><div class="actions"><button class="btn ghost" data-title>MENÚ</button><button class="btn" data-new>REINTENTAR</button></div>`),500)}
function swapW(){cw=(cw+1)%wands.length;castT=Math.max(castT,.15);lastStrip='';toast('V'+(cw+1),wands[cw].name)}
modal.addEventListener('click',e=>{

  if('new' in d){newRun(false);close();toast(BIOMES[0].n.toUpperCase(),'Encuentra el portal del fondo.')}
  else if('lab' in d){newRun(true);close();toast('LABORATORIO','Abre la BOLSA y combina hechizos.')}
  else if('grim' in d)grimoire(box.querySelector('.tabs')?'editor':'title');
  else if('grimp' in d)grimoire('pause');
  else if('back' in d){grimFrom==='editor'?editor():grimFrom==='pause'?(modal.classList.remove('on'),paused=false,pause()):title()}
  else if('title' in d)title();
  else if('go' in d)close();
  else if(d.tab!==undefined){edTab=+d.tab;sel=null;editor()}
  else if(d.hold!==undefined){cw=+d.hold;editor()}
  else if(d.w!==undefined){const i=+d.i,arr=d.w==='inv'?inv:wands[+d.w].slots;
    if(!sel){if(arr[i])sel={w:d.w,i}}else{const sa=sel.w==='inv'?inv:wands[+sel.w].slots;if(sa===arr&&sel.i===i)sel=null;else{const tmp=arr[i];arr[i]=sa[sel.i];sa[sel.i]=tmp;sel=null;wands.forEach(buildOrder)}}
    modal.dataset.ctx='editor';editor()}
  else if(d.chest){if(!addInv(d.chest))toast('BOLSA LLENA');else toast('NUEVO HECHIZO',S[d.chest].n);close()}
  else if('takew' in d){const k=pendingWand;if(wands.length<3){wands.push(k.wand);cw=wands.length-1}else{wands[cw].slots.forEach(s=>s&&addInv(s));wands[cw]=k.wand}
    k.wand.slots.forEach(s=>s&&found.add(s));buildOrder(k.wand);k.gone=true;close();toast('VARITA NUEVA',k.wand.name)}
});
$('bagB').onclick=()=>{edTab=cw;sel=null;modal.dataset.ctx='editor';editor()};
$('strip').onclick=$('bagB').onclick;
$('swapB').onclick=()=>{if(!paused&&!over)swapW()};
$('pauseB').onclick=()=>{modal.dataset.ctx='pause';pause()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused)pause()});

/* ================= LOOP ================= */
newRun(false);title();
let last=performance.now(),acc=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!paused){acc+=dt;let n=0;while(acc>=1/60&&n<3){update(1/60);acc-=1/60;n++}if(n===3)acc=0}
  render(now);hud();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
}
</script>
