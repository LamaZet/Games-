<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mi Carrera Fútbol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: noche de estadio, ambición de crack, transmisión de TV
   IDEA: tu carrera como la ficha de un jugador y el partido como una retransmisión en vivo
   PICTURE: el estadio 3D iluminado por focos; en el menú, tu jugador 3D girando
   COLOUR and TYPE: verde césped nocturno, blanco tiza, oro de trofeo; Barlow Condensed + Barlow
   LAYOUT: menú de carrera en una columna; partido a pantalla completa con marcador arriba y botones a la derecha */
:root{color-scheme:dark;--bg:#07150d;--bg2:#0d2416;--card:#102b1b;--line:#1f4a30;--ink:#f3f6f1;--mute:#9db8a6;--gold:#f5c542;--gold2:#c99a1e;--red:#ff4d5e;--blue:#4aa3ff}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
body{position:fixed;inset:0}
.cd{font-family:"Barlow Condensed",Barlow,sans-serif}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:fixed;inset:0;overflow:auto;z-index:5;padding:18px 16px 48px;display:none;background:radial-gradient(120% 60% at 50% -10%,#1d5a35 0,var(--bg) 60%)}
.screen.on{display:block}
.wrap{max-width:540px;margin:0 auto;display:grid;gap:16px}
h1{font:800 clamp(34px,10vw,52px)/.95 "Barlow Condensed",sans-serif;letter-spacing:.01em;margin:6px 0 0;text-transform:uppercase}
h1 em{font-style:normal;color:var(--gold)}
h2{font:700 15px/1.2 "Barlow Condensed",sans-serif;letter-spacing:.06em;color:var(--mute);margin:0 0 12px;text-transform:uppercase}
.card{background:linear-gradient(180deg,#123320,#0d2416);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{font:700 17px/1 "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#1a1405;background:linear-gradient(180deg,#ffd866,var(--gold));border:0;border-radius:12px;min-height:52px;padding:0 22px;cursor:pointer;box-shadow:0 4px 0 var(--gold2),0 10px 24px #0008}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--gold2)}
.btn.ghost{background:#16382a;color:var(--ink);box-shadow:0 4px 0 #0a1f14}
.btn.wide{width:100%}
.btn:focus-visible,.opt:focus-visible,.plus:focus-visible,input:focus-visible,.club:focus-visible{outline:3px solid #fff;outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:15px;color:var(--mute)}
label{display:block;font:700 13px "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 6px;color:var(--mute)}
input[type=text],input[type=number]{font:600 17px Barlow,sans-serif;width:100%;background:#081a10;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{font:700 15px "Barlow Condensed",sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);background:#081a10;border:1px solid var(--line);border-radius:10px;padding:0 14px;min-height:44px;cursor:pointer}
.opt.on{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold)}
.sw{width:44px;padding:0;border-radius:50%}
.sw.on{box-shadow:0 0 0 3px var(--gold)}
.hero{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
.hero canvas{width:150px;height:190px;border-radius:12px;background:radial-gradient(80% 60% at 50% 40%,#2a6b42,#0a1f14)}
.ovr{font:800 64px/.85 "Barlow Condensed",sans-serif;color:var(--gold)}
.ovr small{font-size:16px;color:var(--mute);letter-spacing:.08em;margin-left:6px}
.pname{font:800 24px/1.05 "Barlow Condensed",sans-serif;text-transform:uppercase;margin:8px 0 4px}
.attrs{display:grid;gap:10px}
.attr{display:grid;grid-template-columns:5em minmax(0,1fr) 2.2em 48px;gap:10px;align-items:center}
.attr b{font:700 19px "Barlow Condensed",sans-serif;text-align:right}
.meter{height:8px;background:#081a10;border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#2fbf63,#9ef0a8)}
.plus{font:800 18px "Barlow Condensed",sans-serif;height:40px;border:0;border-radius:10px;background:var(--gold);color:#1a1405;cursor:pointer}
.plus:disabled{background:#16382a;color:#3f6a50}
.clubs{display:grid;gap:10px}
.club{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:1px solid var(--line);border-radius:14px;cursor:pointer;color:var(--ink);font:inherit;background:#0d2416;padding:14px;min-height:64px}
.club:hover{border-color:var(--gold)}
.crest{width:34px;height:40px;flex:none;clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}
.club b{font:800 20px/1 "Barlow Condensed",sans-serif;text-transform:uppercase}
.club .r{margin-left:auto;font:800 28px "Barlow Condensed",sans-serif;color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font:700 12px "Barlow Condensed",sans-serif;letter-spacing:.08em;color:var(--mute);text-align:right;padding:6px 6px}
td{padding:8px 6px;text-align:right;border-top:1px solid #163a26;white-space:nowrap;font-variant-numeric:tabular-nums}
th:nth-child(2),td:nth-child(2){text-align:left;width:100%;white-space:normal}
tr.me td{color:var(--gold);font-weight:600}
.s4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.s4 b{display:block;font:800 32px/1 "Barlow Condensed",sans-serif;color:var(--gold)}
.s4 span{font-size:13px;color:var(--mute)}
.fixture{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.fixture .tm{display:grid;justify-items:center;gap:6px;font:800 20px "Barlow Condensed",sans-serif}
.fixture .crest{width:46px;height:54px}
.vs{font:700 14px "Barlow Condensed",sans-serif;letter-spacing:.1em;color:var(--mute)}
/* match HUD */
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:2}
#hud.on{display:block}
.sb{position:absolute;left:12px;top:12px;display:flex;align-items:stretch;border-radius:10px;overflow:hidden;box-shadow:0 6px 18px #0009;font:800 18px/1 "Barlow Condensed",sans-serif}
.sb span{padding:8px 10px;display:flex;align-items:center}
.sb .n{background:#0b1a12e6;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:.05em}
.sb .k{background:#000c;color:var(--gold);font-variant-numeric:tabular-nums;min-width:48px;justify-content:center}
.stam{position:absolute;left:12px;top:54px;width:130px;height:6px;background:#0009;border-radius:3px;overflow:hidden}
.stam i{display:block;height:100%;background:linear-gradient(90deg,#4aa3ff,#9fe3ff)}
.rt{position:absolute;right:12px;top:12px;background:#0b1a12e6;border-radius:12px;padding:8px 12px;text-align:center;box-shadow:0 6px 18px #0009}
.rt b{display:block;font:800 26px/1 "Barlow Condensed",sans-serif;color:var(--gold)}
.rt span{font:600 12px Barlow,sans-serif;color:var(--mute)}
#radar{position:absolute;right:12px;top:82px;width:54px;height:84px;border-radius:6px;box-shadow:0 4px 12px #0009}
.pb{position:absolute;right:12px;top:178px;pointer-events:auto;font:800 16px "Barlow Condensed",sans-serif;color:#fff;background:#0b1a12e6;border:0;border-radius:10px;width:54px;height:44px;cursor:pointer}
.btns{position:absolute;right:16px;bottom:22px;display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:12px;pointer-events:auto;align-items:end}
.cb{font:800 15px/1.05 "Barlow Condensed",sans-serif;letter-spacing:.05em;border:2px solid #ffffff40;border-radius:50%;color:#fff;touch-action:none;cursor:pointer;text-shadow:0 1px 2px #000;backdrop-filter:blur(4px)}
.cb.a{width:86px;height:86px;background:#1f9a52cc;grid-column:1;grid-row:2}
.cb.b{width:98px;height:98px;background:#e5394dcc;grid-column:2;grid-row:1/3;align-self:center}
.cb.s{width:66px;height:66px;background:#2f63b8cc;grid-column:1;grid-row:1;justify-self:end}
.cb.down{transform:scale(.93);filter:brightness(1.25)}
.cb.off{opacity:.35}
.tag{position:absolute;transform:translate(-50%,-100%);font:800 14px "Barlow Condensed",sans-serif;letter-spacing:.06em;color:var(--gold);text-shadow:0 1px 3px #000,0 0 8px #000;white-space:nowrap;text-transform:uppercase}
.tag small{display:block;text-align:center;color:#fff;font-size:13px}
.pow{position:absolute;width:64px;height:8px;transform:translate(-50%,0);background:#000b;border-radius:4px;overflow:hidden;display:none}
.pow i{display:block;height:100%;background:var(--gold)}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;font:800 clamp(56px,18vw,120px)/.9 "Barlow Condensed",sans-serif;color:#fff;text-shadow:0 6px 30px #000c;pointer-events:none;opacity:0;transform:scale(.8);transition:opacity .3s,transform .4s cubic-bezier(.2,1.6,.4,1);z-index:3;font-style:italic}
#banner small{display:block;font:700 20px "Barlow Condensed",sans-serif;font-style:normal;letter-spacing:.08em;color:var(--gold);margin-top:10px;text-transform:uppercase}
#banner.on{opacity:1;transform:scale(1)}
#feed{position:fixed;left:50%;top:118px;transform:translateX(-50%);font:700 16px "Barlow Condensed",sans-serif;letter-spacing:.05em;color:#fff;text-shadow:0 2px 6px #000;text-align:center;pointer-events:none;z-index:3;width:70vw;text-transform:uppercase}
.hint{position:fixed;left:16px;bottom:26px;font-size:15px;color:#fff;text-shadow:0 2px 6px #000;pointer-events:none;max-width:42vw;transition:opacity 1s;z-index:3}
.hint.off{opacity:0}
.joy{position:fixed;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid #ffffff50;pointer-events:none;display:none;z-index:3}
.joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#ffffff40}
.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:9;padding:16px}
.modal.on{display:grid}
.modal .card{width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto}
.big{font:800 40px/1 "Barlow Condensed",sans-serif;margin:4px 0 14px}
.load{position:fixed;inset:0;display:grid;place-items:center;font:700 18px "Barlow Condensed",sans-serif;letter-spacing:.1em;color:var(--mute);z-index:20;background:var(--bg)}
@media(orientation:landscape) and (max-height:500px){.cb.a{width:72px;height:72px}.cb.b{width:84px;height:84px}.cb.s{width:56px;height:56px}.btns{bottom:12px}#feed{top:60px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud">
  <div class="sb"><span id="sH">MIO</span><span class="n" id="sc">0 - 0</span><span id="sA">RIV</span><span class="k" id="clk">0'</span></div>
  <div class="stam"><i id="stB"></i></div>
  <div class="rt"><b id="rtB">6.0</b><span id="grB">B-</span></div>
  <canvas id="radar" width="68" height="105"></canvas>
  <button class="pb" id="pauseB" aria-label="Pausa">II</button>
  <div class="tag" id="tag"></div>
  <div class="pow" id="pow"><i id="powI"></i></div>
  <div class="btns">
    <button class="cb s" id="bS">SPRINT</button>
    <button class="cb a" id="bA">PASE</button>
    <button class="cb b" id="bB">TIRO</button>
  </div>
</div>
<div class="joy" id="joyV"><i id="joyK"></i></div>
<div class="hint" id="hint">Arrastra el dedo en la izquierda para moverte. Botones a la derecha.</div>
<div id="banner"></div>
<div id="feed"></div>
<div class="screen" id="scr"></div>
<div class="modal" id="modal"><div class="card" id="mbox"></div></div>
<div class="load" id="load">CARGANDO ESTADIO…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
{
if(!window.THREE){document.getElementById('load').textContent='No se pudo cargar el motor 3D. Revisa tu conexión y recarga.';throw new Error('no three')}
const R=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,$=id=>document.getElementById(id),lerp=(a,b,t)=>a+(b-a)*t;
const W=68,L=105,GW=7.32,GH=2.44,HW=GW/2;
/* ================= DATA ================= */
const CLUBS=[
  {n:'Real Brisas',ab:'RBR',c1:'#f3f3ee',c2:'#2a5ad8',r:74},
  {n:'Deportivo Ceiba',ab:'CEI',c1:'#23a052',c2:'#f3f3ee',r:70},
  {n:'Atlético Marea',ab:'MAR',c1:'#6fc3ff',c2:'#14305a',r:72},
  {n:'Unión Volcán',ab:'VOL',c1:'#d8322e',c2:'#1a1a1a',r:77},
  {n:'Sporting Faro',ab:'FAR',c1:'#ffd23f',c2:'#1a1a1a',r:68},
  {n:'Racing Coral',ab:'COR',c1:'#ff7a33',c2:'#f3f3ee',r:71},
  {n:'Inter Bruma',ab:'BRU',c1:'#7d4ee0',c2:'#f3f3ee',r:75},
  {n:'Olímpico Sierra',ab:'SIE',c1:'#7a1f33',c2:'#e8c25a',r:66}
];
const SKIN=['#f1c69b','#d9a066','#a86b3c','#6b4226'],HAIR=['#2a1a10','#6b3e1e','#e8c25a','#151515','#c0c0c0'];
const POSN={DEL:'Delantero',MED:'Mediocampista',DEF:'Defensa'};
const BASEA={DEL:{pac:70,sho:68,pas:58,dri:66,def:35,phy:60},MED:{pac:64,sho:58,pas:70,dri:67,def:52,phy:60},DEF:{pac:62,sho:40,pas:58,dri:50,def:70,phy:70}};
const WGT={DEL:{sho:.32,pac:.22,dri:.22,pas:.1,phy:.1,def:.04},MED:{pas:.32,dri:.22,sho:.12,pac:.12,def:.12,phy:.1},DEF:{def:.38,phy:.22,pac:.15,pas:.13,dri:.06,sho:.06}};
const ANAME={pac:'Ritmo',sho:'Tiro',pas:'Pase',dri:'Regate',def:'Defensa',phy:'Físico'};
const FORM=[[34,101.5,'G'],[10,87,'D'],[25,90,'D'],[43,90,'D'],[58,87,'D'],[17,73,'M'],[34,76,'M'],[51,73,'M'],[12,59,'F'],[34,57,'F'],[56,59,'F']];
const USLOT={DEL:9,MED:6,DEF:2};
const NAMES=['Rivas','Ortiz','Molina','Vega','Cruz','Soto','Ramos','Peña','Luna','Rojas','Navarro','Castro','Méndez','Ibarra','Ferrer','Salas','Duarte','Campos','Rey','Lara'];
const ovr=p=>Math.round(Object.entries(WGT[p.pos]).reduce((s,[k,w])=>s+p.attr[k]*w,0));
const KEY='mi-carrera-futbol-v1';let C=null;
try{C=JSON.parse(localStorage.getItem(KEY))}catch(e){C=null}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(C))}catch(e){}};
function schedule(){const t=[0,1,2,3,4,5,6,7],rounds=[];for(let r=0;r<7;r++){const m=[];for(let i=0;i<4;i++)m.push([t[i],t[7-i]]);rounds.push(r%2?m.map(([a,b])=>[b,a]):m);t.splice(1,0,t.pop())}return rounds}
function newSeason(){C.season=(C.season||0)+1;C.round=0;C.sched=schedule();C.table=CLUBS.map(()=>({pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0}));C.ss={pj:0,g:0,a:0,rt:0}}
function poisson(l){let k=0,p=Math.exp(-l),s=p,u=R();while(u>s&&k<9){k++;p*=l/k;s+=p}return k}
function rec(a,b,ga,gb){const A=C.table[a],B=C.table[b];A.pj++;B.pj++;A.gf+=ga;A.gc+=gb;B.gf+=gb;B.gc+=ga;if(ga>gb){A.g++;B.p++;A.pts+=3}else if(ga<gb){B.g++;A.p++;B.pts+=3}else{A.e++;B.e++;A.pts++;B.pts++}}
const sorted=()=>C.table.map((t,i)=>({...t,i})).sort((a,b)=>b.pts-a.pts||(b.gf-b.gc)-(a.gf-a.gc)||b.gf-a.gf);
const hexRGB=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),cdist=(a,b)=>{const p=hexRGB(a),q=hexRGB(b);return Math.hypot(p[0]-q[0],p[1]-q[1],p[2]-q[2])},lum=h=>{const c=hexRGB(h);return c[0]*.3+c[1]*.59+c[2]*.11};
const crest=c=>`background:linear-gradient(90deg,${c.c1} 0 50%,${c.c2} 50%)`;

/* ================= 3D: RENDERER & SHARED ================= */
const mobile=matchMedia('(pointer:coarse)').matches;
const gl=$('gl'),renderer=new THREE.WebGLRenderer({canvas:gl,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,mobile?1.75:2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,.5,600);
const cvTex=(w,h,draw,rep)=>{const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=renderer.capabilities.getMaxAnisotropy();if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping}return t};
const lam=(c,o)=>new THREE.MeshLambertMaterial({color:c,...o});

/* ---------- player model ---------- */
const G={};
function geo(){if(G.ok)return;G.ok=1;
  const cyl=(rt,rb,h,s=10)=>{const g=new THREE.CylinderGeometry(rt,rb,h,s);g.translate(0,-h/2,0);return g};
  G.torso=new THREE.CylinderGeometry(.215,.17,.56,16,1);G.torso.scale(1,1,.62);
  G.shorts=new THREE.CylinderGeometry(.19,.205,.22,14);G.shorts.scale(1,1,.68);
  G.neck=new THREE.CylinderGeometry(.055,.06,.1,8);
  G.head=new THREE.SphereGeometry(.118,18,14);G.head.scale(.92,1.06,.98);
  G.hair=new THREE.SphereGeometry(.126,18,10,0,Math.PI*2,0,Math.PI*.52);G.hair.scale(.94,1.04,1.02);
  G.eye=new THREE.SphereGeometry(.014,6,6);
  G.sleeve=cyl(.068,.06,.17,10);G.arm=cyl(.048,.042,.14,8);G.fore=cyl(.044,.036,.25,8);G.hand=new THREE.SphereGeometry(.042,8,6);
  G.thigh=cyl(.082,.066,.42,10);G.shin=cyl(.062,.045,.42,10);G.boot=new THREE.BoxGeometry(.095,.075,.25);G.boot.translate(0,-.03,.05);
  G.shadow=new THREE.CircleGeometry(.45,20);G.shadow.rotateX(-Math.PI/2);
}
const matCache={};const mc=(k,f)=>matCache[k]||(matCache[k]=f());
function shirtTex(c1,c2,num,gk){return cvTex(256,128,(x,w,h)=>{x.fillStyle=c1;x.fillRect(0,0,w,h);
  if(!gk){x.fillStyle=c2;x.fillRect(0,0,w,9);x.globalAlpha=.18;for(let i=0;i<w;i+=16)x.fillRect(i,0,6,h);x.globalAlpha=1}
  x.font='800 74px "Barlow Condensed",Arial Narrow,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle=lum(c1)>150?'#151515':'#ffffff';x.strokeStyle=c2;x.lineWidth=4;x.strokeText(num,w*.5,h*.56);x.fillText(num,w*.5,h*.56);
  x.font='800 22px "Barlow Condensed",Arial Narrow,sans-serif';x.fillText(num,w*.93,h*.32);x.fillText(num,w*.07,h*.32)})}
function makePlayer(o){geo();
  const skin=mc('s'+o.skin,()=>lam(SKIN[o.skin])),hair=mc('h'+o.hair,()=>lam(HAIR[Math.min(o.hair,4)])),eye=mc('eye',()=>lam('#1a1a1a'));
  const shirt=new THREE.MeshLambertMaterial({map:shirtTex(o.shirt,o.trim,o.num,o.gk)}),sleeveM=mc('sl'+o.shirt,()=>lam(o.shirt)),shortsM=mc('sh'+o.shorts,()=>lam(o.shorts)),sockM=mc('so'+o.socks,()=>lam(o.socks)),bootM=mc('b'+o.boot,()=>lam(o.boot));
  const mesh=(g,m,par,x=0,y=0,z=0)=>{const k=new THREE.Mesh(g,m);k.position.set(x,y,z);k.castShadow=true;par.add(k);return k};
  const root=new THREE.Group(),body=new THREE.Group();root.add(body);
  const hips=new THREE.Group();hips.position.y=.96;body.add(hips);
  mesh(G.shorts,shortsM,hips,0,-.02,0);
  const torso=new THREE.Group();torso.position.y=.08;hips.add(torso);
  const t=mesh(G.torso,shirt,torso,0,.28,0);t.rotation.y=0;
  mesh(G.neck,skin,torso,0,.6,0);

  el.addEventListener('pointerdown',e=>{e.preventDefault();btn[k]=true;el.classList.add('down');press(k,true);try{el.setPointerCapture(e.pointerId)}catch(_){}});
  const off=()=>{if(!btn[k])return;btn[k]=false;el.classList.remove('down');press(k,false)};el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off)}
const KB={KeyJ:'a',KeyK:'b',ShiftLeft:'s',KeyL:'s'};
addEventListener('keydown',e=>{if(keys[e.code])return;keys[e.code]=1;const k=KB[e.code];if(k&&M&&!M.paused){btn[k]=true;press(k,true)}if(e.code==='Escape'&&M&&!M.paused)pauseMatch()});
addEventListener('keyup',e=>{keys[e.code]=0;const k=KB[e.code];if(k&&btn[k]){btn[k]=false;press(k,false)}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0;btn.a=btn.b=btn.s=false;joy.id=null;joy.x=joy.y=0;$('joyV').style.display='none'});
function ctxMode(){const b=M.ball,u=M.user;if(b.owner===u)return 'ball';const pt=possTeam();if(pt===u.team)return 'att';if(pt)return 'def';return b.last&&b.last.team===u.team?'att':'def'}
function press(k,down){if(!M||M.phase==='end'||M.phase==='goal')return;const u=M.user,mode=ctxMode();
  if(k==='a'&&down){if(mode==='ball')userPass();else if(mode==='att'){M.call=2;feed(u.name+' pide el balón')}}
  if(k==='b'){if(mode==='ball'){if(down)M.charge=0;else if(M.charge>=0){userShoot(M.charge);M.charge=-1}}
    else if(down&&mode==='def'&&u.stun<=0&&u.slide<=0){const c=M.ball.owner;if(c&&c.team!==u.team){const d=Math.hypot(c.x-u.x,c.y-u.y);if(d<1.9)tackle(u,c,d>1.2);else{u.slide=.7;u.stun=.5;M.st.ta++}}else{u.slide=.7;u.stun=.4}}
    else if(!down)M.charge=-1}}
function dirOf(){let jx=joy.x,jy=joy.y;if(keys.KeyA||keys.ArrowLeft)jx=-1;if(keys.KeyD||keys.ArrowRight)jx=1;if(keys.KeyW||keys.ArrowUp)jy=-1;if(keys.KeyS||keys.ArrowDown)jy=1;
  let dx=jx*camB.rx-jy*camB.fx,dy=jx*camB.ry-jy*camB.fy;const l=Math.hypot(dx,dy);return l>1?[dx/l,dy/l]:[dx,dy]}
function userTarget(){const u=M.user,[jx,jy]=dirOf();let dx=jx,dy=jy;if(Math.hypot(dx,dy)<.3){dx=u.fx;dy=u.fy}const dl=Math.hypot(dx,dy)||1;dx/=dl;dy/=dl;
  let best=null,bs=-9;for(const m of u.team.players){if(m===u)continue;const vx=m.x-u.x,vy=m.y-u.y,d=Math.hypot(vx,vy);if(d<3||d>45)continue;const cs=(vx*dx+vy*dy)/d;if(cs<.55)continue;const s=cs*1.4-d/55-(m.gk?.6:0);if(s>bs){bs=s;best=m}}return best}
function userPass(){const u=M.user,m=userTarget();if(M.phase==='kick'||M.phase==='restart')M.phase='play';
  if(m){let lane=9;for(const o of other(u.team).players)lane=Math.min(lane,segDist(o.x,o.y,u.x,u.y,m.x,m.y));pass(u,m,lane<1.4&&Math.hypot(m.x-u.x,m.y-u.y)>15)}else passDir(u,u.fx,u.fy)}
function userShoot(pw){const u=M.user,[jx]=dirOf();if(M.phase!=='play')M.phase='play';const gk=other(u.team).players[0];
  const side=Math.abs(jx)>.25?Math.sign(jx):(gk.x<W/2?1:-1);shoot(u,W/2+side*(HW-1.1),clamp(pw,.15,1))}
function pauseMatch(){M.paused=true;modalOpen(`<h2>Pausa</h2><div class="big">${M.teams[0].club.ab} ${M.score[0]} - ${M.score[1]} ${M.teams[1].club.ab}</div><p class="note">${Math.floor(M.time)}' · Nota ${M.rating.toFixed(1)}</p>
  <p class="note">Joystick a la izquierda (relativo a la cámara). <b>PASE</b> al compañero marcado con el aro blanco; sin balón, <b>PEDIR</b>. <b>TIRO</b>: mantén para cargar; defendiendo es <b>ENTRADA</b> (de lejos, barrida). <b>PRESIÓN</b> te lleva hacia el balón. Teclado: WASD, J, K, Shift.</p>
  <div class="row" style="justify-content:flex-end"><button class="btn ghost" data-quit>Terminar</button><button class="btn" data-resume>Seguir</button></div>`)}
$('pauseB').onclick=()=>{if(M&&!M.paused&&M.phase!=='end')pauseMatch()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&M&&!M.paused&&M.phase!=='end')pauseMatch()});

/* ---------- update ---------- */
function update(dt){
  const b=M.ball,u=M.user;M.t+=dt;
  const all=M.teams[0].players.concat(M.teams[1].players);
  for(const p of all){p.kick=Math.max(0,p.kick-dt);p.slide=Math.max(0,p.slide-dt);p.dive=Math.max(0,p.dive-dt)}
  if(M.phase==='goal'||M.phase==='half'){M.pT-=dt;
    for(const p of all){let tx=p.x,ty=p.y;if(M.cel&&p.team===M.cel.team&&!p.gk){tx=M.cel.p.x+Math.cos(p.i)*1.6;ty=M.cel.p.y+Math.sin(p.i)*1.6}if(M.cel&&p===M.cel.p){const[gx]=fromOwn(p.team,W/2,0);tx=clamp(p.x+(p.x<W/2?-6:6),2,W-2);ty=p.y+(p.team.side?3:-3)*0}
      steer(p,tx,ty,M.cel&&p.team===M.cel.team,dt);p.x+=p.vx*dt;p.y+=p.vy*dt}
    if(M.pT<=0){if(M.phase==='half'){M.half=2;kickoff(1-M.firstKick)}else kickoff(M.nextKick)}moveBall(dt);return}
  if(M.phase==='kick'||M.phase==='restart'){M.pT-=dt;if(M.pT<=0&&b.owner&&!b.owner.user)M.phase='play';if(M.pT<-6&&b.owner&&b.owner.user)M.phase='play'}
  if(M.phase==='play')M.time+=dt*90/270;
  if(M.half===1&&M.time>=45){M.time=45;M.phase='half';M.pT=2.8;M.cel=null;banner('Descanso',`${M.score[0]} - ${M.score[1]}`);return}
  if(M.time>=M.end){M.time=M.end;finishMatch();return}
  M.call=Math.max(0,M.call-dt);
  const mode=ctxMode(),[jx,jy]=dirOf();let mx=jx,my=jy;
  if(mode==='def'&&btn.a&&u.stun<=0){const tg=b.owner||b;const dx=tg.x-u.x,dy=tg.y-u.y,d=Math.hypot(dx,dy)||1;mx=dx/d;my=dy/d}
  if(u.stun>0){u.stun-=dt;mx*=.15;my*=.15}
  if(u.slide>0){mx=u.fx*.8;my=u.fy*.8}
  const sprint=btn.s&&u.stam>3&&Math.hypot(mx,my)>.2,sp=u.speed*(sprint?1.3:1)*(b.owner===u?.93:1);
  u.vx+=(mx*sp-u.vx)*Math.min(1,dt*7);u.vy+=(my*sp-u.vy)*Math.min(1,dt*7);
  if(sprint)u.stam=Math.max(0,u.stam-dt*(16-u.attr.phy*.09));else u.stam=Math.min(100,u.stam+dt*8);
  if(M.charge>=0)M.charge=Math.min(1.15,M.charge+dt*1.1);
  if((M.phase==='kick'||M.phase==='restart')&&b.owner===u){u.vx=u.vy=0}
  const chasers=t=>t.players.filter(p=>!p.gk&&!p.user&&p.stun<=0).sort((a,c)=>Math.hypot(a.x-b.x,a.y-b.y)-Math.hypot(c.x-b.x,c.y-b.y));
  const ch=[chasers(M.teams[0]),chasers(M.teams[1])];
  for(const t of M.teams)for(const p of t.players){if(p.user)continue;if(p.stun>0)p.stun-=dt;aiPlayer(p,dt,ch[t.side])}
  for(const p of all){p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=clamp(p.x,-3,W+3);p.y=clamp(p.y,-3,L+3);const s=Math.hypot(p.vx,p.vy);
    if(s>1.2&&p.slide<=0){p.fx+=(p.vx/s-p.fx)*Math.min(1,dt*10);p.fy+=(p.vy/s-p.fy)*Math.min(1,dt*10)}else if(p.slide<=0&&p.dive<=0){const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy)||1;p.fx+=(dx/d-p.fx)*Math.min(1,dt*4);p.fy+=(dy/d-p.fy)*Math.min(1,dt*4)}
    const fl=Math.hypot(p.fx,p.fy)||1;p.fx/=fl;p.fy/=fl}
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){const a=all[i],c=all[j],dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy);if(d<.8&&d>0){const push=(.8-d)/2;a.x-=dx/d*push;a.y-=dy/d*push;c.x+=dx/d*push;c.y+=dy/d*push}}
  if(b.owner&&b.owner.stun>0&&!b.owner.gk){const o=b.owner;b.owner=null;b.ign=o;b.ignT=.3}
  moveBall(dt);
  if(!b.owner&&M.phase!=='goal'){let best=null,bd=9;for(const p of all){if(p.stun>0&&p.slide<=0||(b.ign===p&&b.ignT>0))continue;const reach=p.gk?(p.dive>0?1.9:1.25):p.slide>0?1.3:.9,d=Math.hypot(p.x-b.x,p.y-b.y);if(d<reach&&b.z<(p.gk?2.6:1.4)&&d<bd){bd=d;best=p}}
    if(best){const s=Math.hypot(b.vx,b.vy);if(!best.gk&&s>19&&R()<.45){b.vx*=-.25;b.vy*=-.25;b.ign=best;b.ignT=.2;b.last=best}else{if(best.slide>0&&best.user&&b.last&&b.last.team!==best.team){M.st.tw++;rate(.2);feed('¡Barrida limpia!')}take(best)}}}
  if(!b.owner&&M.phase==='play'){
    if(b.y<0||b.y>L){const atk=b.y<0?M.teams[0]:M.teams[1];if(Math.abs(b.x-W/2)<HW&&b.z<GH)return goal(atk);
      const def=other(atk);if(b.last&&b.last.team===atk)restart(def,...fromOwn(def,W/2,99.5),true);else restart(atk,b.x<W/2?.6:W-.6,b.y<0?.6:L-.6)}
    else if(b.x<0||b.x>W){const t=b.last?other(b.last.team):M.teams[0];restart(t,clamp(b.x,.2,W-.2),clamp(b.y,1,L-1))}}
}
function moveBall(dt){const b=M.ball;b.ignT-=dt;b.passT-=dt;
  if(b.owner){const o=b.owner,ph=Math.sin((o.A?o.A.phase:0)*1)*.08;b.x=o.x+o.fx*(.62+ph);b.y=o.y+o.fy*(.62+ph);b.z=0;b.vx=o.vx;b.vy=o.vy;return}
  b.vz-=9.8*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;
  if(b.z<=0){b.z=0;if(b.vz<-2.5)b.vz*=-.45;else b.vz=0;const f=Math.exp(-1.15*dt);b.vx*=f;b.vy*=f}else{const f=Math.exp(-.12*dt);b.vx*=f;b.vy*=f}
  if(M.phase==='goal'){for(const gy of[0,L]){if(Math.abs(b.x-W/2)<HW+.2&&(gy===0?b.y<-2:b.y>L+2)){b.vy*=-.2;b.vx*=.5;b.y=gy===0?-2:L+2}}}
  else for(const gy of[0,L])for(const px of[W/2-HW,W/2+HW]){if(Math.abs(b.y-gy)<.4&&Math.abs(b.x-px)<.35&&b.z<GH){b.vx*=-.6;b.vy*=-.5;feed('¡Al palo!')}}
}
function restart(t,x,y,gk){const b=M.ball;let k;
  if(gk)k=t.players[0];else{k=t.players.filter(p=>!p.gk).sort((a,c)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(c.x-x,c.y-y))[0];if(M.user.team===t&&Math.hypot(M.user.x-x,M.user.y-y)<12)k=M.user}
  k.x=x;k.y=y;k.vx=k.vy=0;const cx=W/2-x,cy=L/2-y,cl=Math.hypot(cx,cy)||1;k.fx=cx/cl;k.fy=cy/cl;
  Object.assign(b,{owner:k,last:k,vx:0,vy:0,vz:0,z:0,pend:null});b.x=k.x+k.fx*.62;b.y=k.y+k.fy*.62;
  M.phase='restart';M.pT=1.1;feed(gk?'Saque de puerta':(y<1||y>L-1)?'Saque de esquina':'Saque de banda');
}
function goal(t){const b=M.ball;M.score[t.side]++;const sc=b.last,own=sc&&sc.team!==t,sh=own?sc:(b.shooter&&b.shooter.team===t&&b.shot?b.shooter:sc);
  const ast=!own&&b.passFrom&&b.passFrom.team===t&&b.passFrom!==sh&&b.passT>0?b.passFrom:null;
  if(t.side===0){if(sh&&sh.user&&!own){M.st.g++;rate(1)}if(ast&&ast.user){M.st.a++;rate(.6)}}else rate(C.p.pos==='DEF'?-.3:-.12);
  banner('¡GOL!',own?'Autogol de '+sc.name:`${sh?sh.name:''}${ast?' · asistencia de '+ast.name:''}`);
  M.phase='goal';M.pT=4;M.nextKick=1-t.side;M.cel={team:t,p:own?t.players[9]:sh||t.players[9],t:0};
}
function finishMatch(){
  M.phase='end';$('hud').classList.remove('on');$('joyV').style.display='none';const s=M.st,[gf,ga]=M.score,win=gf>ga;
  const rt=Math.round(M.rating*10)/10,pts=Math.max(1,Math.round((rt-5)*1.5))+s.g+(s.a?1:0)+(win?1:0);
  C.p.pts+=pts;C.p.tot.pj++;C.p.tot.g+=s.g;C.p.tot.a+=s.a;C.ss.pj++;C.ss.g+=s.g;C.ss.a+=s.a;C.ss.rt+=rt;
  const{o,home}=oppOf();home?rec(C.club,o,gf,ga):rec(o,C.club,ga,gf);
  for(const[a,c]of C.sched[C.round]){if(a===C.club||c===C.club)continue;const ra=CLUBS[a].r+2,rc=CLUBS[c].r;rec(a,c,poisson(clamp(1.35+(ra-rc)*.045,.3,3)),poisson(clamp(1.1+(rc-ra)*.045,.3,3)))}
  C.round++;save();
  const ab=[M.teams[0].club.ab,M.teams[1].club.ab];
  modalOpen(`<h2>${win?'Victoria':gf===ga?'Empate':'Derrota'}</h2><div class="big">${ab[0]} ${gf} - ${ga} ${ab[1]}</div>
  <div class="s4"><div><b>${rt.toFixed(1)}</b><span>Nota</span></div><div><b>${grade(rt)}</b><span>Grado</span></div><div><b>${s.g}</b><span>Goles</span></div><div><b>${s.a}</b><span>Asist.</span></div></div>
  <p class="note" style="margin-top:12px">Pases ${s.pc}/${s.pa} · Tiros a puerta ${s.ot}/${s.sh} · Entradas ${s.tw}/${s.ta}</p>
  <p>Ganaste <b style="color:var(--gold)">${pts} puntos de habilidad</b>.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-cont>Continuar</button></div>`);
  clearMatch();M=null;
}

/* ================= RENDER ================= */
let portrait=true;
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;portrait=innerHeight>=innerWidth;camera.fov=portrait?52:34;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const V=new THREE.Vector3(),V2=new THREE.Vector3(),camDir=new THREE.Vector3();
function render3d(dt){
  const b=M.ball,u=M.user,X=x=>x-W/2,Z=y=>y-L/2;
  for(const t of M.teams)for(const p of t.players){const A=p.A;A.root.position.set(X(p.x),0,Z(p.y));
    const yaw=Math.atan2(p.fx,p.fy);let d=yaw-A.yaw;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;A.yaw+=d*Math.min(1,dt*12);A.root.rotation.y=A.yaw;
    pose(A,{spd:Math.hypot(p.vx,p.vy),kick:p.kick,slide:p.slide,dive:p.dive,diveDir:p.diveDir,cel:M.cel&&M.cel.team===p.team&&M.phase==='goal'?1:0,stun:p.stun,t:M.t+p.i},dt)}
  ballMesh.position.set(X(b.x),b.z+.11,Z(b.y));const bs=Math.hypot(b.vx,b.vy);
  if(bs>.05){ballMesh.rotateOnWorldAxis(V.set(b.vy/bs,0,-b.vx/bs),bs*dt/.11)}
  ballMesh.userData.sh.position.set(X(b.x),.015,Z(b.y));ballMesh.userData.sh.scale.setScalar(1/(1+b.z*.4));
  userRing.position.set(X(u.x),.02,Z(u.y));userRing.material.opacity=.7+Math.sin(M.t*6)*.2;
  const tg=b.owner===u?userTarget():null;targetRing.visible=!!tg;if(tg)targetRing.position.set(X(tg.x),.02,Z(tg.y));
  /* camera */
  let fx=X(b.x*.55+u.x*.45),fz=Z(b.y*.55+u.y*.45);
  if(M.phase==='goal'&&M.cel){fx=X(M.cel.p.x);fz=Z(M.cel.p.y)}
  const close=M.phase==='goal'?.55:1;
  if(portrait)V.set(fx*.6,12.5*close,fz+16*close);else V.set(W/2+19*close-(M.phase==='goal'?20:0),15*close,fz*.92);
  if(M.phase==='goal'&&!portrait)V.set(fx+16,6,fz+10);
  M.cam.lerp(V,Math.min(1,dt*(M.phase==='goal'?2:3.2)));
  V2.set(portrait?fx*.85:fx*.5,0,portrait?fz-6*close:fz);if(M.phase==='goal')V2.set(fx,1,fz);
  M.look.lerp(V2,Math.min(1,dt*4));camera.position.copy(M.cam);camera.lookAt(M.look);
  camera.getWorldDirection(camDir);const fl=Math.hypot(camDir.x,camDir.z)||1;camB.fx=camDir.x/fl;camB.fy=camDir.z/fl;camB.rx=-camB.fy;camB.ry=camB.fx;
  sun.position.set(M.look.x+25,60,M.look.z+30);sun.target.position.copy(M.look);
  const cheer=M.phase==='goal'?Math.abs(Math.sin(M.t*9))*.6:Math.sin(M.t*2)*.05;for(const s of stands)s.position.y=10.5+cheer;
  renderer.render(scene,camera);
  /* overlays */
  V.set(X(u.x),2.05,Z(u.y)).project(camera);const tx=(V.x*.5+.5)*innerWidth,ty=(-V.y*.5+.5)*innerHeight;const tag=$('tag');
  tag.style.left=tx+'px';tag.style.top=ty+'px';tag.innerHTML=`${u.name}${M.call>0?'<small>¡Aquí!</small>':''}`;
  const pw=$('pow');if(M.charge>=0&&b.owner===u){pw.style.display='block';pw.style.left=tx+'px';pw.style.top=(ty+8)+'px';const i=$('powI');i.style.width=Math.min(100,M.charge*100)+'%';i.style.background=M.charge>.85?'#ff4d5e':'#f5c542'}else pw.style.display='none';
  $('sc').textContent=`${M.score[0]} - ${M.score[1]}`;$('clk').textContent=Math.floor(M.time)+"'";$('stB').style.width=u.stam+'%';
  const r=Math.round(M.rating*10)/10;$('rtB').textContent=r.toFixed(1);$('grB').textContent='Nota '+grade(r);
  const mode=ctxMode(),A=$('bA'),B=$('bB');A.textContent=mode==='ball'?'PASE':mode==='att'?'PEDIR':'PRESIÓN';B.textContent=mode==='def'?'ENTRADA':'TIRO';B.classList.toggle('off',mode==='att');
  const rc=$('radar').getContext('2d');rc.fillStyle='#1d5a2acc';rc.fillRect(0,0,68,105);rc.fillStyle='#ffffff40';rc.fillRect(0,52,68,1);rc.strokeStyle='#ffffff40';rc.strokeRect(14,0,40,16);rc.strokeRect(14,89,40,16);
  for(const t of M.teams)for(const p of t.players){rc.fillStyle=p.user?'#f5c542':M.col[t.side].s;rc.beginPath();rc.arc(p.x,p.y,p.user?3.2:2.2,0,7);rc.fill()}rc.fillStyle='#fff';rc.fillRect(b.x-1.5,b.y-1.5,3,3);
}

/* ================= LOOP ================= */
let last=performance.now(),acc=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
  if(M&&!M.paused&&M.phase!=='end'){acc+=dt;let n=0;while(acc>=1/60&&n<3&&M&&M.phase!=='end'){update(1/60);acc-=1/60;n++}if(n===3)acc=0}
  if(M)render3d(dt);else drawPreview(now);
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
const begin=()=>{$('load').style.display='none';if(C&&C.p)hub();else createScreen()};
(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(begin);
}
</script>
