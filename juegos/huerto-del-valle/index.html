<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Huerto del Valle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: cálido, acogedor, juego de granja de bolsillo
   IDEA: una consola de madera con la granja en su pantalla
   PICTURE: el mundo pixel-art en canvas, arriba, ocupando el ancho
   COLOUR and TYPE: verde bosque profundo, madera, acento dorado; Pixelify Sans
   LAYOUT: HUD → mundo → barra de herramientas → cruceta + botón de acción */
:root{color-scheme:dark;--bg:#1d3a24;--wood:#7a4b2a;--wood2:#5c3519;--ink:#fbf1d8;--gold:#f5c542;--panel:#f4e4bf;--pink:#2a1a0e}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Pixelify Sans",system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{max-width:560px;height:100%;margin:0 auto;display:flex;flex-direction:column;padding:8px;gap:8px}
.hud{display:flex;align-items:center;gap:8px;background:var(--wood);border:3px solid var(--wood2);border-radius:10px;padding:6px 10px;box-shadow:inset 0 2px 0 #9c6638}
.hud b{font-weight:700}
.hud .grow{flex:1}
.chip{white-space:nowrap}
.money{color:var(--gold)}
.ebar{width:64px;height:12px;background:#3b2414;border-radius:4px;overflow:hidden;border:2px solid var(--wood2)}
.ebar i{display:block;height:100%;background:linear-gradient(#8fe36b,#4fb03a);transition:width .2s}
.btn{font:inherit;color:var(--pink);background:var(--gold);border:0;border-bottom:3px solid #b8892a;border-radius:8px;padding:6px 12px;min-height:36px;cursor:pointer;font-weight:600}
.btn:active{transform:translateY(2px);border-bottom-width:1px}
.btn:focus-visible,.slot:focus-visible{outline:3px solid #fff;outline-offset:2px}
.screen{position:relative;flex:1;min-height:220px;border:4px solid var(--wood2);border-radius:12px;overflow:hidden;background:#6fb04a;box-shadow:0 4px 0 #0d1f12}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(30,18,8,.85);color:var(--ink);padding:6px 12px;border-radius:8px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
.bar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;background:var(--wood);border:3px solid var(--wood2);border-radius:10px;padding:6px}
.slot{position:relative;background:#e9d3a3;border:3px solid #c9a96b;border-radius:8px;min-height:52px;display:grid;place-items:center;padding:2px;cursor:pointer;color:var(--pink);font:inherit}
.slot svg{width:28px;height:28px;shape-rendering:crispEdges}
.slot.on{border-color:var(--gold);background:#fff3cf;box-shadow:0 0 0 2px var(--gold)}
.slot small{font-size:13px;line-height:1}
.slot .n{position:absolute;right:3px;top:1px;font-size:13px;font-weight:700}
.pad{display:flex;justify-content:space-between;align-items:center;padding:0 6px 4px}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.dpad button,.act{font:inherit;border:0;cursor:pointer;touch-action:none;color:var(--ink)}
.dpad button{background:var(--wood);border-bottom:4px solid var(--wood2);border-radius:10px;font-size:22px}
.dpad button.down{transform:translateY(3px);border-bottom-width:1px;background:#8d5a34}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
.side{display:flex;flex-direction:column;align-items:center;gap:8px}
.act{width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,var(--gold) 60%,#c8941f);color:var(--pink);font-size:20px;font-weight:700;box-shadow:0 5px 0 #8a6414}
.act:active{transform:translateY(4px);box-shadow:0 1px 0 #8a6414}
.modal{position:fixed;inset:0;background:rgba(10,20,12,.6);display:none;place-items:center;padding:16px;z-index:5}
.modal.on{display:grid}
.card{background:var(--panel);color:var(--pink);border:4px solid var(--wood);border-radius:14px;padding:18px;width:min(420px,100%);box-shadow:0 6px 0 var(--wood2)}
.card h2{margin:0 0 8px;font-size:28px;line-height:1.05}
.card p{margin:6px 0}
.card ul{padding-left:18px;margin:8px 0}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed #d6bf8e}
.row svg{width:32px;height:32px;shape-rendering:crispEdges;flex:none}
.row .grow{flex:1}
.row small{display:block;opacity:.75;font-size:13px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.ghost{background:#d9c08a;border-bottom-color:#a88d55}
@media(max-height:640px){.dpad{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}.act{width:72px;height:72px}.slot{min-height:44px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <span class="chip"><b id="day">Día 1</b> · <span id="clock">6:00 am</span></span>
    <span class="chip" id="wx">☀</span>
    <span class="grow"></span>
    <span class="chip money"><b id="money">100</b> g</span>
    <span class="ebar" title="Energía"><i id="energy"></i></span>
  </div>
  <div class="screen" id="screen"><canvas id="cv"></canvas><div id="toast"></div></div>
  <div class="bar" id="bar"></div>
  <div class="pad">
    <div class="dpad" id="dpad">
      <button class="u" data-d="up" aria-label="Arriba">▲</button>
      <button class="l" data-d="left" aria-label="Izquierda">◀</button>
      <button class="r" data-d="right" aria-label="Derecha">▶</button>
      <button class="d" data-d="down" aria-label="Abajo">▼</button>
    </div>
    <div class="side">
      <div style="display:flex;gap:6px"><button class="btn" id="shopBtn">Tienda</button><button class="btn ghost" id="helpBtn">?</button></div>
      <button class="act" id="act">Usar</button>
    </div>
  </div>
</div>

<div class="modal" id="modal"><div class="card" id="card"></div></div>

<script>
{
const T=16,W=24,H=18;
const CROPS={
  rabano:{n:'Rábano',cost:20,sell:45,days:3,c:'#e0457b'},
  maiz:{n:'Maíz',cost:40,sell:100,days:5,c:'#f2c230'},
  calabaza:{n:'Calabaza',cost:80,sell:220,days:7,c:'#f07f1f'}
};
const SLOTS=['azada','regadera','rabano','maiz','calabaza'];
const NAMES={azada:'Azada',regadera:'Agua',rabano:'Rábano',maiz:'Maíz',calabaza:'Calab.'};
const icon=id=>{
  if(id==='azada')return '<svg viewBox="0 0 16 16"><rect x="7" y="4" width="2" height="11" fill="#8b5a2b"/><rect x="3" y="1" width="9" height="3" fill="#9aa3ad"/><rect x="3" y="4" width="2" height="2" fill="#7c858f"/></svg>';
  if(id==='regadera')return '<svg viewBox="0 0 16 16"><rect x="3" y="6" width="8" height="7" fill="#5f87b0"/><rect x="11" y="7" width="2" height="2" fill="#5f87b0"/><rect x="13" y="5" width="2" height="3" fill="#5f87b0"/><rect x="5" y="3" width="4" height="1" fill="#3f6185"/><rect x="5" y="3" width="1" height="3" fill="#3f6185"/><rect x="8" y="3" width="1" height="3" fill="#3f6185"/><rect x="4" y="7" width="2" height="2" fill="#8fb4d9"/></svg>';
  const c=CROPS[id].c;
  return `<svg viewBox="0 0 16 16"><rect x="3" y="5" width="10" height="10" fill="#c9a26b"/><rect x="5" y="2" width="6" height="3" fill="#a9824e"/><rect x="4" y="5" width="8" height="1" fill="#a9824e"/><rect x="6" y="8" width="4" height="4" fill="${c}"/><rect x="7" y="7" width="2" height="1" fill="#4fa83a"/></svg>`;
};
const D={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const KEY='huerto-del-valle-v1';

function genMap(){
  const m=new Array(W*H).fill(0);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(!x||!y||x==W-1||y==H-1)m[y*W+x]=2;
  for(let y=1;y<=3;y++)for(let x=2;x<=5;x++)m[y*W+x]=5;
  m[3*W+7]=7;
  for(let y=4;y<=5;y++)m[y*W+4]=4;
  for(let x=5;x<=12;x++)m[5*W+x]=4;
  for(let y=12;y<=15;y++)for(let x=17;x<=21;x++)if(!((x==17||x==21)&&(y==12||y==15)))m[y*W+x]=3;
  [[9,1],[13,2],[19,3],[21,6],[1,9],[2,15],[14,16],[22,10],[16,2],[10,16]].forEach(([x,y])=>m[y*W+x]=2);
  return m;
}
function fresh(){return{day:1,time:360,money:100,energy:100,water:20,seeds:{rabano:6,maiz:0,calabaza:0},bag:{rabano:0,maiz:0,calabaza:0},map:genMap(),crops:{},wet:{},rain:false,slot:0,px:5,py:6,face:'down',seen:false};}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.map)S=fresh();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),screen=$('screen');
let scale=3,mv=null,held=null,paused=false,toastT=0,tick=0,saveT=0;

const at=(x,y)=>(x<0||y<0||x>=W||y>=H)?2:S.map[y*W+x];
const walk=(x,y)=>[0,1,4].includes(at(x,y));
const hash=(x,y)=>((x*73856093)^(y*19349663))>>>0;

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1600);}

function fmt(m){let h=Math.floor(m/60)%24,mm=Math.floor(m%60/10)*10;const ap=h<12?'am':'pm';h=h%12||12;return `${h}:${String(mm).padStart(2,'0')} ${ap}`;}
function hud(){
  $('day').textContent='Día '+S.day;$('clock').textContent=fmt(S.time);
  $('money').textContent=S.money;$('energy').style.width=S.energy+'%';
  $('wx').textContent=S.rain?'🌧':'☀';
  $('bar').innerHTML=SLOTS.map((id,i)=>{
    const n=id==='regadera'?S.water:CROPS[id]?S.seeds[id]:'';
    return `<button class="slot${S.slot===i?' on':''}" data-i="${i}" aria-label="${NAMES[id]}">${n!==''?`<span class="n">${n}</span>`:''}${icon(id)}<small>${NAMES[id]}</small></button>`;
  }).join('');
}

function target(){const [dx,dy]=D[S.face];return[S.px+dx,S.py+dy];}
function use(){
  if(paused)return;
  const [tx,ty]=target(),t=at(tx,ty),i=ty*W+tx,tool=SLOTS[S.slot],cr=S.crops[i];
  if(t===5){return sleepAsk();}
  if(t===7){return ship();}
  if(cr&&cr.g>=CROPS[cr.k].days){S.bag[cr.k]++;delete S.crops[i];toast(`+1 ${CROPS[cr.k].n} · ponlo en la caja`);return hud();}
  if(tool==='regadera'&&t===3){S.water=20;toast('Regadera llena');return hud();}
  const tired=c=>{if(S.energy<c){toast('Estás agotado… ve a dormir');return true}S.energy-=c;return false};
  if(tool==='azada'){
    if(t===0){if(tired(2))return;S.map[i]=1;if(S.rain)S.wet[i]=1;}
    else toast(t===1?'Ya está arado':'Aquí no se puede arar');
  }else if(tool==='regadera'){
    if(t!==1)return toast('Riega la tierra arada');
    if(S.wet[i])return toast('Ya está regado');
    if(S.water<=0)return toast('Sin agua: rellena en el estanque');
    if(tired(1))return;S.water--;S.wet[i]=1;
  }else{
    if(t!==1)return toast('Primero ara la tierra');
    if(cr)return toast('Ya hay algo sembrado');
    if(S.seeds[tool]<=0)return toast('Sin semillas: ve a la Tienda');
    S.seeds[tool]--;S.crops[i]={k:tool,g:0};
  }
  hud();
}
function ship(){
  let tot=0,n=0;for(const k in S.bag){tot+=S.bag[k]*CROPS[k].sell;n+=S.bag[k];S.bag[k]=0;}
  if(!n)return toast('No tienes cosechas para vender');
  S.money+=tot;toast(`Vendiste ${n} por ${tot} g`);hud();save();
}
function newDay(passedOut){
  for(const i in S.crops){if(S.wet[i]||S.rain)S.crops[i].g++;}
  S.wet={};S.day++;S.time=360;S.energy=passedOut?60:100;
  S.rain=Math.random()<.2;
  if(S.rain)S.map.forEach((t,i)=>{if(t===1)S.wet[i]=1});
  S.px=4;S.py=4;S.face='down';mv=null;
  hud();save();
  modal(`<h2>Día ${S.day}</h2><p>${passedOut?'Te desmayaste de cansancio… despiertas con menos energía.':'Dormiste bien. Energía al máximo.'}</p><p>${S.rain?'Está lloviendo: tus cultivos se riegan solos hoy.':'Hace sol. No olvides regar.'}</p><div class="actions"><button class="btn" data-close>A trabajar</button></div>`);
}
function sleepAsk(){
  modal(`<h2>¿Dormir?</h2><p>Los cultivos regados crecerán durante la noche.</p><div class="actions"><button class="btn ghost" data-close>Todavía no</button><button class="btn" id="zz">Dormir</button></div>`);
  $('zz').onclick=()=>{close();newDay(false)};
}
function shop(){
  const rows=Object.entries(CROPS).map(([k,c])=>`<div class="row">${icon(k)}<div class="grow"><b>${c.n}</b><small>${c.cost} g · ${c.days} días · vende a ${c.sell} g</small></div><button class="btn" data-buy="${k}" data-q="1">+1</button><button class="btn" data-buy="${k}" data-q="5">+5</button></div>`).join('');
  modal(`<h2>Tienda del pueblo</h2><p>Tienes <b>${S.money} g</b></p>${rows}<div class="actions"><button class="btn" data-close>Cerrar</button></div>`);
}
function help(){
  modal(`<h2>Huerto del Valle</h2><p>Heredaste una granja abandonada. ¡Hazla prosperar!</p><ul><li>Elige una herramienta abajo y pulsa <b>Usar</b> frente a una casilla.</li><li><b>Azada</b> ara, luego <b>siembra</b> y <b>riega</b> cada día.</li><li>Rellena la regadera en el estanque.</li><li>Recoge lo maduro y llévalo a la <b>caja</b> junto a la casa para venderlo.</li><li>Usa la puerta de la casa para dormir. Si sigues despierto a las 2 am, te desmayas.</li></ul><p><small>Teclado: flechas/WASD, espacio, 1–5.</small></p><div class="actions"><button class="btn ghost" id="reset">Reiniciar partida</button><button class="btn" data-close>Jugar</button></div>`);
  $('reset').onclick=()=>{S=fresh();S.seen=true;save();hud();close();toast('Nueva partida');};
}
function modal(html){$('card').innerHTML=html;$('modal').classList.add('on');paused=true;held=null;}
function close(){$('modal').classList.remove('on');paused=false;}
$('modal').addEventListener('click',e=>{
  const b=e.target.closest('[data-buy]');
  if(b){const k=b.dataset.buy,q=+b.dataset.q,c=CROPS[k].cost*q;if(S.money<c){toast('No te alcanza el dinero');return}S.money-=c;S.seeds[k]+=q;hud();save();shop();return;}
  if(e.target.closest('[data-close]')||e.target.id==='modal')close();
});

/* ---------- drawing ---------- */
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h);}
function grass(x,y){rect(x,y,T,T,'#6fb04a');const h=hash(x,y);for(let k=0;k<3;k++){const a=(h>>(k*5))&15,b=(h>>(k*5+3))&15;rect(x+a,y+b,1,2,'#5c9a3c');}if(h%11===0){rect(x+5,y+6,2,2,'#f6e27a');}}
function tile(tx,ty){
  const x=tx*T,y=ty*T,t=at(tx,ty),i=ty*W+tx;
  if(t===0)grass(x,y);
  else if(t===1){const w=S.wet[i];rect(x,y,T,T,w?'#5a3920':'#8d5c36');for(let r=2;r<T;r+=4)rect(x+1,y+r,T-2,1,w?'#4a2d18':'#77492a');}
  else if(t===4){rect(x,y,T,T,'#d9b97c');const h=hash(tx,ty);rect(x+(h&12),y+((h>>4)&12),2,1,'#c4a266');}
  else if(t===3){rect(x,y,T,T,'#3d8ad0');const o=(tick/300+tx+ty)%4|0;rect(x+2+o*2,y+4+(tx%2)*5,5,1,'#8cc8f2');}
  else if(t===2||t===7||t===5)grass(x,y);
}
function tree(tx,ty){const x=tx*T,y=ty*T;rect(x+2,y+13,12,3,'rgba(0,0,0,.2)');rect(x+6,y+9,4,6,'#6b4426');ctx.fillStyle='#2f7a3a';ctx.beginPath();ctx.arc(x+8,y+6,7,0,7);ctx.fill();ctx.fillStyle='#45a04c';ctx.beginPath();ctx.arc(x+6,y+4,4,0,7);ctx.fill();}
function house(){const x=2*T,y=1*T;rect(x+2,y+44,62,4,'rgba(0,0,0,.2)');rect(x+2,y+18,60,28,'#ead5a6');for(let r=22;r<46;r+=6)rect(x+2,y+r,60,1,'#d6bd88');
  rect(x-2,y+2,68,18,'#b84a3a');for(let r=6;r<20;r+=5)rect(x-2,y+r,68,1,'#963629');rect(x-2,y+18,68,2,'#7d2c21');
  rect(x+8,y+25,10,9,'#5e86b5');rect(x+9,y+26,4,3,'#a6c8ea');rect(x+12,y+25,1,9,'#ead5a6');rect(x+8,y+29,10,1,'#ead5a6');
  rect(x+34,y+30,12,16,'#7a4b2a');rect(x+43,y+38,2,2,'#f5c542');rect(x+46,y+24,8,8,'#5e86b5');rect(x+47,y+25,3,3,'#a6c8ea');
  rect(x+50,y-2,6,8,'#8a8a8a');}
function bin(){const x=7*T,y=3*T;rect(x+1,y+13,14,3,'rgba(0,0,0,.2)');rect(x+1,y+4,14,11,'#9a6235');rect(x+1,y+4,14,3,'#7a4b2a');rect(x+1,y+9,14,1,'#7a4b2a');rect(x+6,y+5,4,1,'#f5c542');}
function crop(i){
  const c=S.crops[i],tx=i%W,ty=i/W|0,x=tx*T,y=ty*T,cd=CROPS[c.k],p=c.g/cd.days;
  if(c.g===0){rect(x+6,y+8,4,3,'#a07a4a');rect(x+7,y+7,2,1,'#6a4a28');return;}
  const g='#4fa83a',dg='#36832a';
  if(p<.5){rect(x+7,y+7,2,6,g);rect(x+4,y+6,3,2,g);rect(x+9,y+5,3,2,dg);return;}
  if(p<1){rect(x+7,y+3,2,10,g);rect(x+3,y+5,4,2,g);rect(x+9,y+4,4,2,dg);rect(x+4,y+9,3,2,dg);return;}
  const b=Math.sin(tick/250+i)*.6;
  if(c.k==='rabano'){rect(x+5,y+8,6,5,cd.c);rect(x+6,y+13,4,1,cd.c);rect(x+6,y+2+b,1,6,g);rect(x+9,y+3+b,1,5,dg);rect(x+4,y+2+b,3,2,g);rect(x+9,y+2+b,3,2,dg);}
  else if(c.k==='maiz'){rect(x+7,y+1,2,13,g);rect(x+3,y+6,4,1,g);rect(x+9,y+8,4,1,dg);rect(x+9,y+3+b,3,6,cd.c);rect(x+9,y+2+b,2,1,'#c9e88a');}
  else{rect(x+2,y+7,12,7,cd.c);rect(x+4,y+7,1,7,'#d0661a');rect(x+8,y+7,1,7,'#d0661a');rect(x+11,y+7,1,7,'#d0661a');rect(x+7,y+4,2,3,'#6b8a2a');rect(x+9,y+4+b,3,2,g);}
}
function player(px,py,walking){
  const x=px*T,y=py*T,bob=walking?((tick/90|0)%2):0,f=S.face;
  rect(x+3,y+14,10,2,'rgba(0,0,0,.25)');
  rect(x+5,y+11,2,4-bob,'#3b3b5c');rect(x+9,y+11,2,3+bob,'#3b3b5c');
  rect(x+4,y+6,8,6,'#3a6fc2');rect(x+4,y+10,8,1,'#2c548f');
  rect(x+5,y+1-bob/2,6,6,'#f1c69b');
  rect(x+2,y+1,12,2,'#e6c25a');rect(x+4,y-2,8,3,'#e6c25a');rect(x+4,y,8,1,'#c69a33');
  if(f==='down'){rect(x+6,y+4,1,1,'#2a1a0e');rect(x+9,y+4,1,1,'#2a1a0e');}
  else if(f==='left')rect(x+5,y+4,1,1,'#2a1a0e');
  else if(f==='right')rect(x+10,y+4,1,1,'#2a1a0e');
  else rect(x+5,y+3,6,3,'#5a3620');
  const tool=SLOTS[S.slot];
  if(tool==='azada')rect(x+(f==='left'?1:12),y+7,2,6,'#8b5a2b');
  if(tool==='regadera')rect(x+(f==='left'?0:12),y+8,4,4,'#5f87b0');
}
function resize(){const d=devicePixelRatio||1;cv.width=screen.clientWidth*d;cv.height=screen.clientHeight*d;scale=Math.max(2,Math.round(cv.width/(11*T)));}
const ro=new ResizeObserver(resize);ro.observe(screen);

function draw(){
  ctx.imageSmoothingEnabled=false;
  const vw=cv.width/scale,vh=cv.height/scale;
  let ppx=S.px,ppy=S.py;if(mv){ppx=mv.fx+(mv.tx-mv.fx)*mv.t;ppy=mv.fy+(mv.ty-mv.fy)*mv.t;}
  let cx=ppx*T+8-vw/2,cy=ppy*T+8-vh/2;
  cx=vw>=W*T?(W*T-vw)/2:Math.max(0,Math.min(W*T-vw,cx));cy=vh>=H*T?(H*T-vh)/2:Math.max(0,Math.min(H*T-vh,cy));
  ctx.setTransform(1,0,0,1,0,0);rect(0,0,cv.width,cv.height,'#24502c');
  ctx.setTransform(scale,0,0,scale,Math.round(-cx*scale),Math.round(-cy*scale));
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)tile(x,y);
  for(const i in S.crops)crop(+i);
  if(!paused){const [tx,ty]=target();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1;ctx.strokeRect(tx*T+.5,ty*T+.5,T-1,T-1);}
  house();bin();
  for(let y=0;y<H;y++){for(let x=0;x<W;x++)if(at(x,y)===2)tree(x,y);if(Math.floor(ppy+.5)===y)player(ppx,ppy,!!mv);}
  ctx.setTransform(1,0,0,1,0,0);
  if(S.rain){ctx.strokeStyle='rgba(200,225,255,.55)';ctx.lineWidth=scale/2;ctx.beginPath();for(let k=0;k<60;k++){const rx=(hash(k,3)%cv.width+tick*.3*scale)%cv.width,ry=(hash(k,9)%cv.height+tick*.9*scale)%cv.height;ctx.moveTo(rx,ry);ctx.lineTo(rx-2*scale,ry+6*scale);}ctx.stroke();rect(0,0,cv.width,cv.height,'rgba(40,60,90,.18)');}
  const night=Math.min(.5,Math.max(0,(S.time-1080)/360*.5));
  if(night>0)rect(0,0,cv.width,cv.height,`rgba(20,20,70,${night})`);
}

let last=performance.now();
function loop(now){
  const dt=Math.min(50,now-last);last=now;tick+=dt;
  if(!paused){
    if(mv){mv.t+=dt/150;if(mv.t>=1){S.px=mv.tx;S.py=mv.ty;mv=null;}}
    if(!mv&&held){S.face=held;const [dx,dy]=D[held],nx=S.px+dx,ny=S.py+dy;if(walk(nx,ny))mv={fx:S.px,fy:S.py,tx:nx,ty:ny,t:0};}
    const before=Math.floor(S.time/10);S.time+=dt/1000*1.4;
    if(Math.floor(S.time/10)!==before){$('clock').textContent=fmt(S.time);}
    if(S.time>=1560)newDay(true);
    saveT+=dt;if(saveT>8000){saveT=0;save();}
  }
  draw();requestAnimationFrame(loop);
}

/* ---------- input ---------- */
const dpad=$('dpad');
dpad.querySelectorAll('button').forEach(b=>{
  const on=e=>{e.preventDefault();if(paused)return;held=b.dataset.d;S.face=held;b.classList.add('down');try{b.setPointerCapture(e.pointerId)}catch(_){}};
  const off=()=>{if(held===b.dataset.d)held=null;b.classList.remove('down');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
});
$('act').addEventListener('pointerdown',e=>{e.preventDefault();use();});
$('bar').addEventListener('click',e=>{const s=e.target.closest('.slot');if(s){S.slot=+s.dataset.i;hud();}});
$('shopBtn').onclick=shop;$('helpBtn').onclick=help;
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{
  if(KM[e.code]){e.preventDefault();if(!paused)held=KM[e.code];}
  else if(e.code==='Space'||e.code==='Enter'){if(!paused){e.preventDefault();use();}}
  else if(/^Digit[1-5]$/.test(e.code)){S.slot=+e.code.slice(5)-1;hud();}
  else if(e.code==='Escape')close();
});
addEventListener('keyup',e=>{if(KM[e.code]===held)held=null;});
addEventListener('blur',()=>{held=null;save();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});

resize();hud();
if(!S.seen){S.seen=true;help();}
requestAnimationFrame(loop);
}
</script>
