<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>El Gran Golpe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: película de atracos, tensa y con humor negro; tú eres el cerebro de la banda
   (motor compartido con Escuadrón Halcón)
   IDEA: mesa de planificación táctica que cobra vida al ejecutar el plan
   PICTURE: plano cenital en pixel art de un edificio, conos de visión y rutas de colores
   COLOUR and TYPE: noche azul pizarra, ámbar de radio, verde de visor; fuente de píxel 3x5 + Press Start 2P
   LAYOUT: lienzo 16:9 a pantalla completa con barra de misión arriba y panel del equipo a la derecha */
:root{color-scheme:dark;--ink:#e8ecef;--amber:#ffcd75;--green:#a7f070}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07080d;color:var(--ink);overflow:hidden;font:16px/1.45 "Pixelify Sans",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
body{position:fixed;inset:0}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.modal{position:fixed;inset:0;background:#07080dd8;display:none;place-items:center;padding:14px;z-index:9}
.modal.on{display:grid}
.box{background:#10151e;width:min(860px,100%);max-height:calc(100vh - 28px);overflow:auto;padding:20px;box-shadow:0 0 0 3px #000,0 0 0 6px #ffcd75,0 0 0 9px #000,0 14px 0 9px #0007}
.title{font:clamp(20px,5.4vw,36px)/1.2 "Press Start 2P",monospace;color:var(--amber);text-shadow:4px 4px 0 #b13e53,8px 8px 0 #000;text-align:center;margin:6px 0 6px}
.sub{text-align:center;color:var(--green);font:10px/1.6 "Press Start 2P",monospace;margin-bottom:14px}
h2{font:15px/1.4 "Press Start 2P",monospace;color:var(--amber);margin:0 0 12px}
p{margin:8px 0}
.note{font-size:14px;color:#94b0c2}
.list{display:grid;gap:10px;margin:14px 0}
.ms{display:flex;gap:12px;align-items:center;text-align:left;border:0;cursor:pointer;color:var(--ink);font:inherit;padding:10px;background:#1d2a33;box-shadow:inset 0 0 0 3px #000;min-height:64px}
.ms:hover,.ms:focus-visible{background:#257179;outline:none}
.ms.lock{opacity:.45;cursor:default}
.ms img{width:110px;height:66px;image-rendering:pixelated;flex:none;box-shadow:0 0 0 2px #000}
.ms b{font:11px/1.6 "Press Start 2P",monospace}
.stars{color:var(--amber);font:12px "Press Start 2P",monospace;letter-spacing:2px}
.row{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.btn{font:11px/1 "Press Start 2P",monospace;color:#10151e;background:var(--amber);border:0;min-height:46px;padding:0 18px;cursor:pointer;box-shadow:0 0 0 3px #000,inset -3px -4px 0 #ef7d57}
.btn.alt{background:#94b0c2;box-shadow:0 0 0 3px #000,inset -3px -4px 0 #566c86}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
ul{padding-left:18px;margin:8px 0}
.chip{display:inline-block;font-size:13px;padding:0 6px;margin:2px 3px 0 0;background:#257179;color:#e8ecef}
.chip.bad{background:#7a2b3a}
.ms.on{background:#38563f;box-shadow:inset 0 0 0 3px #a7f070}
.bar{display:inline-block;width:70px;height:7px;background:#3a1018;vertical-align:middle;box-shadow:0 0 0 1px #000}.bar i{display:block;height:100%}
.ms .r{margin-left:auto;text-align:right;font-size:14px;color:#94b0c2;flex:none;max-width:60%}
.ms>span:first-child{flex:1 1 0;min-width:0}
.ms{padding:12px 14px}
.ms .r .btn{max-width:100%}
.money{color:var(--amber);font:13px "Press Start 2P",monospace}
.btn[disabled]{opacity:.4;cursor:default}
.sm{min-height:34px;font-size:9px;padding:0 10px}
.steps{display:flex;gap:6px;margin:0 0 14px}.step{flex:1;text-align:center;padding:9px 4px;font:9px/1.3 "Press Start 2P",monospace;background:#1d2432;color:#566c86;box-shadow:inset 0 0 0 2px #000}.step.on{background:#ffcd75;color:#10151e}.step.done{background:#38563f;color:#a7f070}
.hub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:10px 0}
.hubc{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;border:0;cursor:pointer;color:var(--ink);font:inherit;padding:14px;background:#1d2a33;box-shadow:inset 0 0 0 3px #000;min-height:84px}
.hubc i{grid-row:1/3;font-style:normal;font-size:28px;text-align:center;color:var(--amber)}.hubc b{font:11px/1.5 "Press Start 2P",monospace}.hubc span{font-size:14px;color:#94b0c2}
.hubc:hover,.hubc:focus-visible{background:#257179;outline:none}.hubc.main{grid-column:1/-1;background:#5d275d;min-height:96px}.hubc.main:hover{background:#7a3a7a}
.hdr{display:flex;flex-wrap:wrap;gap:6px 22px;background:#0b0d14;padding:9px 12px;margin:0 0 12px;box-shadow:inset 0 0 0 2px #1d2432;font-size:15px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;position:sticky;bottom:-20px;background:#10151e;padding:12px 0 4px;box-shadow:0 -8px 12px #10151e}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;background:#1d2a33;margin:8px 0;box-shadow:inset 0 0 0 3px #000}
.sum{display:flex;gap:14px;align-items:flex-start}.sum img{width:220px;max-width:40%;image-rendering:pixelated;box-shadow:0 0 0 2px #000}
.sumh{cursor:pointer;font:11px "Press Start 2P",monospace;color:var(--amber);margin:8px 0}
.msg{background:#0b0d14;padding:8px 12px;margin-bottom:10px;box-shadow:inset 3px 0 0 #a7f070}
.tutx{}
#tut{display:none;position:fixed;inset:0;z-index:8;pointer-events:none}
#tut .tbox{position:fixed;width:min(380px,calc(100vw - 20px));background:#10151e;padding:16px 18px;pointer-events:auto;box-shadow:0 0 0 3px #000,0 0 0 6px #ffcd75,0 0 0 9px #000,0 12px 0 9px #0008}
#side{position:fixed;display:none;background:#0b0d14;border-right:2px solid #b13e53;overflow:auto;padding:10px;z-index:5;color:#e8ecef;font:14px/1.3 'Pixelify Sans',system-ui,sans-serif}
#side.drawer{box-shadow:6px 0 0 #000}
#side h4{font:9px/1.4 'Press Start 2P',monospace;color:#ffcd75;margin:14px 0 6px;letter-spacing:.5px}#side h4:first-child{margin-top:0}
#side .ob{display:flex;gap:8px;align-items:center;margin:4px 0}#side .ob i{font-style:normal;width:18px;text-align:center}#side .ob.done{color:#a7f070}#side .ob .pb{flex:1;height:5px;background:#333c57;margin-left:auto;max-width:70px}#side .ob .pb b{display:block;height:100%;background:#ffcd75}
#side .mut{color:#566c86;font-size:13px}
table.kt{width:100%;border-collapse:collapse;margin:6px 0}table.kt th{font:9px 'Press Start 2P',monospace;color:#94b0c2;text-align:right;padding:4px}table.kt th:first-child,table.kt td:first-child{text-align:left}table.kt td{text-align:right;padding:4px;border-bottom:1px solid #1d2432}
#tut h3{font:13px/1.4 "Press Start 2P",monospace;color:var(--amber);margin:4px 0 10px}
#tut p{font-size:16px;margin:0 0 14px}#tut .tstep{font:9px "Press Start 2P",monospace;color:#566c86}
#tut .trow{display:flex;gap:8px;align-items:center}
.tmenu{display:grid;gap:10px;max-width:340px;margin:18px auto 4px}.tmenu .btn{min-height:50px}
@media(max-width:560px){.hub{grid-template-columns:1fr}.sum{flex-direction:column}.sum img{max-width:100%}}
.modal.full{padding:0;background:#07080d}
.modal.full .box.wide{width:100%;height:100vh;height:100dvh;max-height:none;overflow:hidden;padding:0;box-shadow:none;display:flex;flex-direction:column}
.hubhead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:#0b0d14;box-shadow:inset 0 -3px 0 #000,inset 0 -6px 0 #ffcd75}
.hubhead .ht{font:clamp(14px,3.6vw,22px)/1.2 "Press Start 2P",monospace;color:var(--amber);text-shadow:3px 3px 0 #b13e53,6px 6px 0 #000}
.hubhead .hs{font:10px "Press Start 2P",monospace;color:var(--green);white-space:nowrap}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;flex:1;min-height:0;padding:16px}
.side{display:grid;gap:6px;align-content:start;overflow-y:auto;min-height:0;padding:0 3px 3px 0}
.sidei{display:flex;align-items:center;gap:10px;border:0;cursor:pointer;color:var(--ink);font:11px/1.3 "Press Start 2P",monospace;text-align:left;background:#1d2a33;box-shadow:inset 0 0 0 3px #000;padding:12px;min-height:44px}
.sidei i{display:flex;align-items:center;justify-content:center;width:20px;height:20px;color:var(--amber);flex:none}.sidei i svg{display:block}
.sidei span{flex:1;min-width:0}.sidei em{font-style:normal;font:9px "Press Start 2P",monospace;background:#000;color:var(--green);padding:3px 5px}
.sidei:hover,.sidei:focus-visible{background:#257179;outline:none}
.sidei.on{background:var(--amber);color:#10151e;box-shadow:inset 0 0 0 3px #000,inset -3px -4px 0 #ef7d57}.sidei.on i{color:#10151e}.sidei.on em{background:#10151e;color:var(--amber)}
.sidei.out{margin-top:10px;background:#10151e;color:#94b0c2}
.main{min-width:0;min-height:0;overflow-y:auto;padding:0 6px 0 2px;overscroll-behavior:contain}
.main .nav{bottom:0;margin-bottom:0}
.main:has(>.list):not(:has(>.list~*:not(.nav))){display:flex;flex-direction:column}
.main:has(>.list):not(:has(>.list~*:not(.nav)))>*{flex:none}
.main:has(>.list):not(:has(>.list~*:not(.nav)))>.list{flex:1 1 auto;min-height:170px;overflow-y:auto;align-content:start;grid-auto-rows:max-content;margin:10px 0;padding:0 6px 0 0;overscroll-behavior:contain}
.list>.ms{flex-shrink:0}
.main:has(>.list):not(:has(>.list~*:not(.nav)))>.nav{position:static;box-shadow:none;margin-top:0;padding:10px 0 0}
.shell .nav{justify-content:flex-end}.shell .nav .btn:last-child{margin-left:auto}
.shell .nav [data-go="hub"]{display:none}.shell .nav:has(>[data-go="hub"]:only-child){display:none}
@media(max-width:700px){.modal.full .box.wide{padding:0}.shell{padding:10px}.hubhead{padding:10px 12px}.shell{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);gap:10px}.side{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;overflow-y:hidden;padding:0 0 6px;gap:6px}.sidei{padding:10px;min-height:40px;font-size:9px}.sidei i{width:auto}.sidei.out{margin:0}}
.goals{list-style:none;padding:0;margin:8px 0 2px;display:grid;gap:6px}.goals li{margin:0;display:flex;gap:10px;align-items:baseline}.goals .gk{flex:none;width:16px;text-align:center}
.hubwrap{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);grid-template-rows:auto 1fr;gap:16px;align-items:start;min-height:100%}.hubl{grid-column:1;grid-row:1}.goalbox{grid-column:2;grid-row:1}.hubcta{grid-column:2;grid-row:2;align-self:end}.hubcta .hub{margin:0;grid-template-columns:1fr}.hubl{min-width:0}.goalbox{display:grid;gap:12px;margin:0}.goalmain{background:#241c10;padding:14px;box-shadow:inset 0 0 0 3px #000,inset 0 0 0 6px #ffcd75}.gtag{font:9px/1.4 "Press Start 2P",monospace;color:#10151e;background:var(--amber);display:inline-block;padding:3px 6px;margin-bottom:10px}.gtitle{font:14px/1.5 "Press Start 2P",monospace;color:var(--amber);text-shadow:2px 2px 0 #b13e53}.goalmain .note{margin:8px 0 0;color:#d9c9a8}.goalsub{margin:0;padding:12px 14px}@media(max-width:900px){.hubwrap{grid-template-columns:1fr;grid-template-rows:none;min-height:0}.hubl,.goalbox,.hubcta{grid-column:1;grid-row:auto}}

/* Música: menú/escondite vs. golpe en curso. Al cambiar, la pista actual termina sola si le quedan
   ≤MUS_TAIL s; si le queda más, se apaga con un fundido de MUS_FADE s. La siguiente entra con fundido. */
const MUS={menu:new Audio('audio/menu.mp3'),game:new Audio('audio/gameplay.mp3')},MUS_GAIN=.55,MUS_TAIL=10,MUS_FADE=4,MUS_LOOP=2.5,MUS_GAP=3;let musCur=null,musGap=0;

function musicTick(dt){const want=S?'game':'menu',goal=muted||document.hidden?0:CFG.vol/100*MUS_GAIN;
  const ramp=(a,tv,r)=>{const v=a.volume;a.volume=clamp(v<tv?Math.min(tv,v+dt*r):Math.max(tv,v-dt*r),0,1)};
  if(musCur&&musCur!==want){const a=MUS[musCur],left=a.duration-a.currentTime;
    if(goal===0||a.paused||!isFinite(left)){a.pause();a.volume=0;musCur=null}
    else{if(left>MUS_TAIL){ramp(a,0,goal/MUS_FADE);if(a.volume<=0){a.pause();musCur=null}}else ramp(a,goal,.8);if(musCur)return}}
  if(!musCur){musCur=want;MUS[want].currentTime=0}
  for(const k in MUS){const a=MUS[k],cur=k===musCur,left=a.duration-a.currentTime,
      env=cur&&isFinite(left)&&!a.paused?clamp(Math.min(a.currentTime,left)/MUS_LOOP,0,1):1,/* cierre y entrada suaves en cada vuelta */
      tv=cur?goal*env:0;
    if(cur&&a.ended){musGap+=dt;if(musGap<MUS_GAP)continue;musGap=0;a.currentTime=0;a.volume=0}else if(cur)musGap=0;/* silencio entre vueltas */
    ramp(a,tv,.8);
    if(tv>0&&a.paused)a.play().catch(()=>{});else if((!cur||goal===0)&&a.volume===0&&!a.paused)a.pause()}}

const blocksSight=(x,y)=>{if(!inb(x,y))return false;const t=grid[y*GW+x];return t===WALL||t===CRATE||(t===DOOR&&doorAt(x,y).state===0)};
function los(x0,y0,x1,y1){const d=hyp(x1-x0,y1-y0),n=Math.ceil(d/.18);for(let i=1;i<n;i++){const t=i/n;if(blocksSight(Math.floor(x0+(x1-x0)*t),Math.floor(y0+(y1-y0)*t)))return false}return true}
function rayEnd(x,y,a,max){const dx=Math.cos(a),dy=Math.sin(a);let d=0;while(d<max){d+=.12;const X=x+dx*d,Y=y+dy*d;if(blocksSight(Math.floor(X),Math.floor(Y))||!inb(Math.floor(X),Math.floor(Y)))return[X,Y,true]}return[x+dx*max,y+dy*max,false]}

function parse(MM){const M=MM.map(r=>r.padEnd(GW,',').slice(0,GW));while(M.length<GH)M.push(','.repeat(GW));
  grid=new Uint8Array(GW*GH);flo=new Uint8Array(GW*GH);flv=new Uint8Array(GW*GH).fill(255);deco=new Array(GW*GH).fill('');doors=new Map();
  const spawns=[],ens=[],hos=[],cams=[],van=[],zs=[],civs=[],loot=[],cash=[];let bomb=null,panel=null,vaultAt=null;const ent=[],unres=[];

  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const ch=M[y][x],i=y*GW+x;
    if(LOG[ch]!==undefined){grid[i]=LOG[ch];if(FLV[ch]!==undefined)flv[i]=FLV[ch];else if(ch==='#'||ch==='W')flv[i]=3;else unres.push(i)}

  for(let y=0;y<GH;y++)for(let x=0;x<GW;x++){const i=y*GW+x,t=grid[i];flo[i]=(t>=WOOD&&t<=CARP)?t:t===OUT?OUT:WOOD;
    if(t===DOOR){const hz=T_(x-1,y)===WALL||T_(x+1,y)===WALL||T_(x-1,y)===WIN||T_(x+1,y)===WIN||T_(x-1,y)===DOOR&&(T_(x-2,y)===WALL||T_(x-2,y)===WIN)||T_(x+1,y)===DOOR&&(T_(x+2,y)===WALL||T_(x+2,y)===WIN);doors.set(i,{x,y,i,state:0,mode:'abrir',hz,swing:0})}}
  if(vaultAt){const dv=doors.get(vaultAt[1]*GW+vaultAt[0]);dv.vault=true;dv.locked=true}
  for(const cm of cams){let sx=0,sy=0;for(let j=-5;j<=5;j++)for(let i=-5;i<=5;i++){const t=T_(Math.floor(cm.x)+i,Math.floor(cm.y)+j);if(t>=WOOD&&t<=CARP&&los(cm.x,cm.y,cm.x+i,cm.y+j)){sx+=i;sy+=j}}cm.ang=Math.atan2(sy,sx)}

function astar(sx,sy,tx,ty,maxLen=999){if(!passable(tx,ty))return null;const N=GW*GH,g=new Float32Array(N).fill(1e9),from=new Int32Array(N).fill(-1),open=[],closed=new Uint8Array(N);

  while(open.length){let bi=0;for(let k=1;k<open.length;k++)if(open[k][0]<open[bi][0])bi=k;const[,cur]=open.splice(bi,1)[0];if(closed[cur])continue;closed[cur]=1;
    const cx=cur%GW,cy=cur/GW|0;if(cx===tx&&cy===ty)break;if(g[cur]>maxLen)continue;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=cx+dx,ny=cy+dy;if(!passable(nx,ny))continue;
      if(dx&&dy){if(!passable(cx+dx,cy)||!passable(cx,cy+dy)||T_(cx+dx,cy)===DOOR||T_(cx,cy+dy)===DOOR||T_(nx,ny)===DOOR||T_(cx,cy)===DOOR)continue}

  if(!UL('fama'))fg=0;C.fame=Math.max(0,C.fame+fg);const fameTxt=fg>0?`<span style="color:#a7f070">+${fg} de fama</span>`:fg<0?`<span style="color:#ff6b6b">${fg} de fama</span>`:'';
  const PAPER=`<div class="paper"><div class="pname">LA GACETA DEL MALECÓN · SEMANA ${C.week-1}</div><div class="phead">${hl}</div><div class="psub">${sub}</div></div><p class="note" style="text-align:center">Fama de la banda: <b>${C.fame}</b> ${fameTxt} · con más fama llegan mejores reclutas</p>`;
  const MOM=S.mom&&S.mom.length?`<h2 style="margin-top:14px;font-size:12px">MOMENTOS DEL GOLPE</h2><div class="moms">${S.mom.map(m=>`<div><span class="mt">${Math.floor(m.t/60)}:${String(Math.floor(m.t%60)).padStart(2,'0')}</span><span style="color:${m.col}">${m.s}</span></div>`).join('')}</div>`:'';
  const RPT=(UL('fama')?PAPER:'')+`<h2>${C.won?'¡LO LOGRARON!':ok?'¡GOLPE EXITOSO!':empty?'HUIDA SIN BOTÍN':'EL GOLPE FRACASÓ'}</h2><p>${S.why}</p>${ok?`<p class="stars" style="font-size:24px">${stars(st)}</p>`:''}
  <div class="stat"><span>Bolsas</span><span>${S.bags}/${totalBags()} (${fmt(S.bags*BAG)})</span><span>Cajas registradoras</span><span>${fmt(S.cashTaken)}</span><span>Tiempo</span><span>${Math.floor(S.time/60)}:${String(Math.floor(S.time%60)).padStart(2,'0')}</span><span>Alarma</span><span>${S.alarm?'Sonó':S.police?'—':'Nunca sonó'}</span>${ops.map(o=>`<span style="color:${o.col}">${o.n}</span><span>${!o.alive?'muerto':o.arrested?'arrestado':o.fled?'huyó':'escapó'} · ${o.kills} bajas · nervios ${Math.round(o.nerve)}</span>`).join('')}</div>
  ${MOM}${ledger}${news.length?`<p>${news.join('<br>')}</p>`:''}`;
  C.last={html:RPT,week:C.week-1,bank:BANKINFO[MS.bank].n};storeGC();
  open(RPT+`<div class="row">${!C.won&&C.week<=DEADLINE?'<button class="btn alt" data-act="retry">OTRO GOLPE AQUÍ</button>':''}<button class="btn" data-act="hq">AL ESCONDITE</button></div>`)}
modal.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;audioInit();sfx('click');const d=b.dataset;
  if(d.go!==undefined){CUR=d.go;hq();return}
  if(d.start!==undefined){startHeist(d.start);return}
  if(d.cfg!==undefined){const k=d.cfg;if(k==='mute')muted=!muted;else if(k==='speed')CFG.speed=CFG.speed===1?2:1;else CFG[k]=!CFG[k];storeCFG();applyCFG();CFG_BACK==='hub'&&!S?hq():openSettings(CFG_BACK);return}
  if(d.vol!==undefined){CFG.vol=clamp(CFG.vol+(+d.vol),0,100);storeCFG();applyCFG();CFG_BACK==='hub'&&!S?hq():openSettings(CFG_BACK);return}
  if(d.b!==undefined){PICK.b=+d.b;hq();return}
  if(d.r!==undefined){if(PICK.sq.has(d.r))PICK.sq.delete(d.r);else if(PICK.sq.size<4)PICK.sq.add(d.r);else sfx('deny');hq();return}
  if(d.hire!==undefined){const r=GC.pool[+d.hire];if(GC.money>=r.cost&&GC.roster.length<8){GC.money-=r.cost;const nr={...r,cost:0};if(R()<.35&&GC.roster.length){const p=pick(GC.roster.filter(q=>!q.bond));if(p)bondPair(nr,p)}GC.roster.push(nr);GC.pool[+d.hire]=mkCrook();if(PICK.sq.size<4)PICK.sq.add(nr.id);storeGC();sfx('cash')}hq(`${r.name} se une a la banda.`);return}
  if(d.bail!==undefined){const j=GC.jail[+d.bail];if(j&&GC.money>=j.bail&&GC.roster.length<8){GC.money-=j.bail;GC.jail.splice(+d.bail,1);j.r.nerve=Math.max(j.r.nerve,50);GC.roster.push(j.r);if(PICK.sq&&PICK.sq.size<4)PICK.sq.add(j.r.id);storeGC();sfx('cash');hq(`<span style="color:#a7f070">Pagaste la fianza. ${j.r.name} está de vuelta.</span>`)}return}
  if(d.kit!==undefined){PICK.kit[d.kit]=Math.max(0,Math.min((PICK.kit[d.kit]||0)+(+d.dv),GC.inv[d.kit]||0,ITEMS[d.kit].max));hq();return}
  if(d.buy!==undefined){const it=ITEMS[d.buy];if(GC.money>=it.cost){GC.money-=it.cost;GC.inv[d.buy]=(GC.inv[d.buy]||0)+1;if((PICK.kit[d.buy]||0)<it.max)PICK.kit[d.buy]=(PICK.kit[d.buy]||0)+1;storeGC();sfx('cash')}hq();return}
  if(d.upg!==undefined){const u=GINV[d.upg];if(GC.money>=u.cost&&!GC.upg[d.upg]&&!(u.req&&!u.req(GC))){GC.money-=u.cost;GC.upg[d.upg]=true;storeGC();sfx('cash')}hq(`Compraste: ${u.n}.`);return}
  const a=d.act;
  if(a==='hq'){CUR='hub';hq()}
  else if(a==='tut'){close();startTut()}
  else if(a==='cfg-title')openSettings('title');else if(a==='cfg-pause')openSettings('pause');
  else if(a==='cfg-back'){if(CFG_BACK==='pause')pauseMenu();else title()}
  else if(a==='hq-cancel'){GC.inHeist=null;for(const k in MS.kit)GC.inv[k]=(GC.inv[k]||0)+MS.kit[k];storeGC();hq()}
  else if(a==='pay'){const v=Math.min(5000,GC.money,GC.debt);GC.money-=v;GC.debt-=v;storeGC();hq(`Pagaste ${fmt(v)} a Don Ramiro.`)}
  else if(a==='payall'){const v=Math.min(GC.money,GC.debt);GC.money-=v;GC.debt-=v;storeGC();hq(GC.debt?`Pagaste ${fmt(v)}.`:'<b style="color:#a7f070">¡Deuda saldada! Don Ramiro ya no te busca.</b>')}
  else if(a==='borrow'){GC.money+=10000;GC.debt+=10000;storeGC();hq('Don Ramiro te presta '+fmt(10000)+'. Sonríe demasiado.')}
  else if(a==='small'){const g=2000+Math.round(R()*25)*100;GC.money+=g;GC.heat=Math.min(8,GC.heat+(GC.upg.contacto?.5:1));let m=`Trabajito hecho: <b style="color:#a7f070">+${fmt(g)}</b>. La búsqueda sube.`;if(GC.roster.length&&R()<.12){const r=pick(GC.roster);GC.roster.splice(GC.roster.indexOf(r),1);const p=GC.roster.find(q=>q.bond===r.id);if(p){p.bond=null;p.bondType=''}const nn=[];jailUp(r,nn,'cayó preso en el trabajito');m+='<br>'+nn[0]}else if(GC.roster.length){const r=pick(GC.roster);r.nerve=Math.max(0,r.nerve-10)}const nw=[];passWeek(nw);m+='<br>'+nw.join('<br>');storeGC();hq(m)}
  else if(a==='lay'){GC.money-=2500;GC.heat=Math.max(0,GC.heat-2);for(const r of GC.roster)r.nerve=Math.min(100,r.nerve+20);const nw=[];passWeek(nw);storeGC();hq('La banda se quedó tranquila una semana.<br>'+nw.join('<br>'))}else if(a==='newcar'){CUR='hub';newCareer();PICK={b:0,sq:null,kit:null};hq('Nueva banda: cuatro ladrones, '+fmt(GC.money)+' y una deuda de '+fmt(GC.debt)+' con Don Ramiro. Tienes '+DEADLINE+' semanas para dar EL GRAN GOLPE.')}
  else if(a==='reset')open(`<h2>¿NUEVA CARRERA?</h2><p>Perderás la banda, el dinero y el equipo.</p><div class="row"><button class="btn alt" data-act="menu">CANCELAR</button><button class="btn" data-act="newcar">EMPEZAR DE CERO</button></div>`);
  else if(a==='go-heist')goHeist();
  else if(a==='leader'){newGame('leader');close()}
  else if(a==='go')close();
  else if(a==='restart'){if(!S)return;if(!S.started||S.time<3){const m=S.mode,sp=S.speed,hc=S.halcon,fm=S.form;newGame(m);S.form=fm;S.speed=sp;S.halcon=hc;close();radio('CHOFER','Volvemos a empezar. Planeen con calma.','#ffcd75')}
    else open(`<h2>¿REINICIAR EL GOLPE?</h2><p>El golpe ya empezó, así que reiniciar cuenta como <b>abandonarlo</b>: pasa una semana, se pierde el equipo que llevaron, bajan los nervios de la banda y sube la búsqueda.</p><p class="note">Luego vuelves a la confirmación del mismo golpe para intentarlo otra vez.</p><div class="row"><button class="btn alt" data-act="go">SEGUIR JUGANDO</button><button class="btn" data-act="restart-yes">REINICIAR</button></div>`)}
  else if(a==='restart-yes'){S=null;CUR='plan4';hq()}
  else if(a==='retry'){CUR='plan4';hq()}
  else if(a==='abort'){close();finishHeist(S.ops.some(o=>able(o)&&inVan(o)))}
  else if(a==='menu')title();
  else if(a==='fs'){toggleFS();setTimeout(()=>{if(modal.classList.contains('on')&&box.querySelector('.setrow'))(CFG_BACK==='hub'&&!S?hq():openSettings(CFG_BACK))},300)}});

/* ================= LOOP ================= */
let last=performance.now(),acc=0;
function loop(now){const rdt=Math.min(.05,(now-last)/1000);last=now;musicTick(rdt);
  if(S){if(!S.decals)S.decals=[];updSide(rdt);
    S.shake=Math.max(0,S.shake-rdt*18);S.white=Math.max(0,S.white-rdt*1.4);for(const l of S.log)l.t-=rdt;
    if(S.started&&!S.paused&&!S.tut&&!modal.classList.contains('on')&&(!S.over||performance.now()-S.endAt<1700)){let sc=S.speed;
      if(S.mode==='leader'){const L=leader();if(S.halcon&&L&&!S.over){leaderMove(L,rdt*S.speed);const tg=L.moving||L.busy>0?1:L.target?.3:.06;S.ts=lerp(S.ts,tg,Math.min(1,rdt*(tg>S.ts?16:5)))}else S.ts=1;sc*=S.ts}
      if(S.wheel)sc*=.15;
      if(S.slow>0){sc*=.35;S.slow-=rdt}acc+=rdt*sc;let n=0;while(acc>=1/60&&n<8){update(1/60);acc-=1/60;n++}if(n>=8)acc=0}
    else{S.t+=rdt*.5}
    render()}
  else{c.fillStyle='#07080d';c.fillRect(0,0,VW,VH);if(staticLayer){c.globalAlpha=.4;c.drawImage(staticLayer,MX,MY);c.globalAlpha=1}present()}
  requestAnimationFrame(loop)}
if(/[?&]thumbs\b/.test(location.search))window.THUMBS=BANKS.map(preview);
title();requestAnimationFrame(loop);
}
